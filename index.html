<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<title>みんなでポチッ v0.9</title>
<style>
:root{
  --ink:#1d2433;--sub:#5b6478;--line:#e3e6ee;--bg:#f4f5f9;--card:#fff;
  --brand:#ff5a36;--brand-soft:#fff3ef;--ok:#2e9e65;--ng:#e5484d;--r:14px;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55em 1em;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{border-color:#c9cedb}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--ng);border-color:#f3c4c5}
button.big{font-size:1.1rem;padding:.8em 1.4em}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{border:1px solid #cfd4e0;border-radius:10px;padding:.55em .7em;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
small,.muted{color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.card h3{margin:0 0 12px;font-size:1.02rem;display:flex;align-items:center;gap:.4em}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:.78rem;color:var(--sub);margin-bottom:4px;font-weight:700}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.92rem;cursor:pointer}
.chk input{width:auto;margin:0;accent-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.72rem;background:#eef0f6;border-radius:99px;padding:.15em .65em;color:var(--sub);font-weight:600}
.chip.used{background:#e3f5ea;color:#1f7a4a}
.btnprev{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.bp{background:var(--c);color:#fff;border-radius:8px;padding:.25em .8em;font-weight:800;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#1d2433;color:#fff;padding:.7em 1.2em;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>div{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 14px;font-size:1.2rem}
.warn{background:#fff4d6;border:1px solid #f5d27a;border-radius:10px;padding:8px 12px;font-size:.85rem}
.msgpage{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
.msgpage .mp-icon{font-size:3.4rem}
.msgpage h2{margin:.3em 0}
.msgpage p{color:var(--sub)}
@keyframes pulse{from{opacity:1}to{opacity:.45}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- トップ ---------- */
.land{max-width:720px;margin:0 auto;padding:36px 16px 60px}
.logo{font-size:2.2rem;font-weight:900;letter-spacing:.02em;line-height:1.2}
.logo span{color:var(--brand)}
.lead{color:var(--sub);margin:.4em 0 20px}
.demo-banner{background:#fff4d6;border:1px solid #f5d27a;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.modes{display:grid;gap:8px}
.mode{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.mode input{width:auto;margin-top:5px;accent-color:var(--brand)}
.mode:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.qitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.qitem .qt{flex:1;min-width:0}
.qitem .qt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.qitem .acts button{padding:.35em .7em;font-size:.85rem}

/* ---------- 参加者（スマホ） ---------- */
body.v-part{background:#fff7ee}
.p-wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.p-title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.p-mode{margin-top:8px;font-size:.76rem;background:#fff;border:1px solid #f0dcc4;border-radius:10px;padding:6px 10px;color:#6b4e2e}
.p-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.p-q{font-size:1.35rem;font-weight:800;line-height:1.45;text-align:center;margin-bottom:14px;word-break:break-word;animation:pop .3s ease}
.p-timer{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.p-timer .bar{flex:1;height:10px;background:#f1e2cf;border-radius:99px;overflow:hidden}
.p-timer .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff5a36);border-radius:99px;transition:width .25s linear}
.p-timer span{font-weight:900;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.p-timer.hurry span{color:var(--ng);animation:pulse .5s infinite alternate}
.p-timer.nolimit .bar{display:none}
.p-opts{display:grid;gap:12px}
.p-opts.n4,.p-opts.n5,.p-opts.n6{grid-template-columns:1fr 1fr}
.opt{position:relative;border:none;border-radius:18px;background:var(--c);color:#fff;font-size:1.45rem;font-weight:900;min-height:88px;padding:14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,opacity .2s;white-space:normal;word-break:break-word;line-height:1.25}
.p-opts.n2 .opt{min-height:min(25vh,190px);font-size:2rem}
.p-opts.n3 .opt{min-height:min(16vh,120px);font-size:1.7rem}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.p-opts.has .opt:not(.sel){opacity:.35}
.opt.sel{outline:5px solid #1d2433;outline-offset:3px}
.opt.sel::after{content:"✓";position:absolute;top:6px;right:12px;font-size:1.2rem}
.p-note{text-align:center;margin-top:18px;font-weight:700;color:var(--sub);min-height:1.5em}
.p-note.done{color:var(--ok)}
.p-center{text-align:center}
.p-center .big{font-size:3.6rem;line-height:1.2}
.p-center h2{margin:.3em 0 .2em;font-size:1.4rem}
.p-center p{color:var(--sub);margin:.3em 0}
.p-answer{display:inline-block;margin-top:14px;background:var(--c,#999);color:#fff;font-weight:900;font-size:1.3rem;border-radius:12px;padding:.4em 1em}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin:0 4px;animation:pulse .7s infinite alternate}
.dots i:nth-child(2){animation-delay:.23s}.dots i:nth-child(3){animation-delay:.46s}
.p-join .card{margin-top:16px}
.p-join .pin{font-size:1.8rem;letter-spacing:.4em;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.p-err{color:var(--ng);font-weight:700;min-height:1.4em;margin:-4px 0 8px;font-size:.9rem}
.p-off{position:fixed;top:0;left:0;right:0;background:#e5484d;color:#fff;text-align:center;font-size:.8rem;padding:3px;display:none;z-index:9}
.p-off.show{display:block}

/* ---------- ステージ（モニタ表示） ---------- */
body.v-disp{background:#0b1026;overflow:hidden}
body.v-disp #app{position:fixed;inset:0}
body.v-disp.idle{cursor:none}
.stage{container-type:size;position:relative;width:100%;height:100%;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#22306e 0%,#0b1026 62%)}
.st{position:absolute;inset:0;display:flex;flex-direction:column;padding:4cqh 4cqw}
.st-title{font-size:4.4cqh;font-weight:800;opacity:.85;text-align:center}
.st-q{font-size:min(5.6cqw,9.5cqh);font-weight:900;line-height:1.25;text-align:center;margin:0 0 2.5cqh;word-break:break-word}
.st-q.small{font-size:min(3.6cqw,6.2cqh);opacity:.9}
.st-foot{display:flex;justify-content:space-between;align-items:center;font-size:3.4cqh;margin-top:2.4cqh;gap:2cqw}
.st-foot b{font-size:1.25em;font-variant-numeric:tabular-nums}
.st-mode{opacity:.65;font-size:.85em}
.st-join{flex:1;display:flex;align-items:center;justify-content:center;gap:5cqw;min-height:0}
.st-qr{background:#fff;padding:2cqh;border-radius:2.6cqh;height:min(60cqh,40cqw);aspect-ratio:1;flex:none}
.st-qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.st-lead{font-size:5cqh;font-weight:800;margin-bottom:3cqh;line-height:1.3}
.st-pinlabel{font-size:3.2cqh;opacity:.7}
.st-pin{font-size:min(17cqh,12cqw);font-weight:900;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:#ffd54a;line-height:1.05}
.st-url{font-size:2.5cqh;opacity:.6;margin-top:2.4cqh;word-break:break-all;max-width:46cqw}
.st-demo{margin-top:2cqh;font-size:2.4cqh;background:#ffb020;color:#1d2433;border-radius:1cqh;padding:.6cqh 1.2cqh;font-weight:800;max-width:46cqw}
.st-count{font-size:5.4cqh;font-weight:900}
.st-timer{display:flex;align-items:center;gap:2cqw;margin-bottom:3cqh}
.st-bar{flex:1;height:2.4cqh;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden}
.st-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd54a,#ff7a45);border-radius:99px;transition:width .25s linear}
.st-sec{font-size:8cqh;font-weight:900;min-width:13cqw;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.st-sec small{font-size:.45em;margin-left:.15em}
.st-timer.hurry .st-sec{color:#ff6b6b;animation:pulse .5s infinite alternate}
.st-timer.nolimit .st-bar{visibility:hidden}
.st-timer.over .st-sec{font-size:6cqh;color:#ffd54a}
.tiles{flex:1;display:grid;gap:2.4cqh 2cqw;grid-template-columns:repeat(var(--cols),1fr);align-content:center;min-height:0}
.tile{background:var(--c);border-radius:2.4cqh;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:min(5.4cqw,9cqh);padding:2cqh 1.5cqw;min-height:18cqh;text-align:center;word-break:break-word;line-height:1.2;box-shadow:0 1cqh 0 rgba(0,0,0,.28)}
.cols{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2.2cqw;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col-top{text-align:center;font-weight:900;font-size:min(7.5cqw,11cqh);line-height:1;font-variant-numeric:tabular-nums}
.col-top small{font-size:.42em;margin-left:.08em}
.col-pct{font-size:3.2cqh;opacity:.75;text-align:center;margin:.6cqh 0 1cqh;font-variant-numeric:tabular-nums}
.col-track{flex:1;position:relative;background:rgba(255,255,255,.07);border-radius:1.6cqh 1.6cqh 0 0;min-height:3cqh}
.col-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);border-radius:1.6cqh 1.6cqh 0 0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.col-label{background:var(--c);text-align:center;font-weight:900;font-size:min(3.8cqw,6cqh);padding:1.2cqh .6cqw;border-radius:1.6cqh;margin-top:1.4cqh;word-break:break-word;line-height:1.15}
.col-track{border-bottom:.5cqh solid rgba(255,255,255,.35)}
.col.win .col-top{color:#ffd54a}
.col-top{position:relative;padding-top:.62em}
.col.win .col-top::before{content:"👑";position:absolute;top:0;left:0;right:0;font-size:.42em;line-height:1.2}
.col.win .col-fill{box-shadow:0 0 3cqh rgba(255,213,74,.55)}
.col-names{font-size:2cqh;opacity:.85;margin-top:1cqh;line-height:1.35;height:8.4cqh;overflow:hidden;text-align:center;word-break:break-all}
.st-big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;text-align:center}
.st-big b{font-size:min(15cqh,11cqw);font-weight:900;color:#ffd54a;line-height:1.1;animation:pop .35s ease}
.st-big span{font-size:4.6cqh;opacity:.85}
.st-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;transition:opacity .6s;z-index:5}

/* ---------- マスター（操作） ---------- */
body.v-op{background:#eef0f5}
.op-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px}
.op-brand{font-weight:900;font-size:1.05rem}
.op-brand span{color:var(--brand)}
.demo-tag{background:#ffb020;color:#fff;font-size:.7rem;border-radius:6px;padding:.15em .5em;margin-left:.4em;vertical-align:middle}
.op-room{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;flex:1}
.op-kv{display:flex;align-items:baseline;gap:6px}
.op-kv label{font-size:.72rem;color:var(--sub);font-weight:700}
.op-kv b{font-size:1.1rem}
#hPin{letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--brand)}
.mini{padding:.15em .5em!important;font-size:.8rem!important;border-radius:7px!important}
.op-actions{display:flex;gap:8px;flex-wrap:wrap}
.op-tabs{display:flex;gap:4px;padding:12px 18px 0;max-width:1400px;margin:0 auto}
.op-tabs button{border-radius:10px 10px 0 0;border-color:transparent;background:#dfe2ea;color:var(--sub)}
.op-tabs button.on{background:#fff;color:var(--ink)}
.op-body{max-width:1400px;margin:0 auto;padding:0 18px 40px}
.op-run{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;align-items:start}
.op-run .card:first-child{border-top-left-radius:0}
.op-edit{display:grid;grid-template-columns:minmax(320px,500px) 1fr;gap:16px;align-items:start}
.op-edit .card:first-child{border-top-left-radius:0}
.lbls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phase{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:900}
.phase .dot{width:14px;height:14px;border-radius:50%;background:#9aa2b5;flex:none}
.phase.open .dot{background:var(--ng);animation:pulse .7s infinite alternate}
.phase.closed .dot{background:#ffb020}
.phase.result .dot{background:var(--ok)}
.op-q{margin:6px 0 0;font-weight:700;word-break:break-word}
.op-timer{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.op-timer.hurry{color:var(--ng)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toggles button{font-size:.85rem;padding:.4em .8em}
.toggles button.on{background:#1d2433;color:#fff;border-color:#1d2433}
.preview{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1026;position:relative}
.ores-q{font-weight:800;margin-bottom:6px}
.ores-row{display:grid;grid-template-columns:minmax(4em,auto) 1fr auto;gap:10px;align-items:center;margin:7px 0}
.ores-lab{font-weight:800;padding:.15em .6em;border-radius:7px;color:#fff;background:var(--c);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ores-bar{height:14px;background:#eef0f6;border-radius:99px;overflow:hidden}
.ores-bar i{display:block;height:100%;background:var(--c);transition:width .4s}
.ores-n{font-weight:900;font-variant-numeric:tabular-nums;min-width:5.2em;text-align:right}
.ores-names{grid-column:1/-1;font-size:.8rem;color:var(--sub);margin:-4px 0 2px;word-break:break-all}
.ores-tot{margin-top:8px;font-weight:700}
.sharebox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sharebox img{width:132px;height:132px;image-rendering:pixelated;border:6px solid #fff;outline:1px solid var(--line);border-radius:6px}
.sharebox .u{font-size:.8rem;word-break:break-all;background:#f4f5f9;border-radius:8px;padding:6px 8px;margin:6px 0}
.op-hist{max-width:980px}
.help{font-size:.92rem;line-height:1.7}
.help h2{margin:0 0 6px}
.help h3{font-size:1.02rem;margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.help h4{font-size:.95rem;margin:12px 0 2px}
.help ul,.help ol{margin:4px 0 6px;padding-left:1.4em}
.help p{margin:4px 0}
.help .note{font-size:.84rem;color:var(--sub)}
.help .credit{font-size:.78rem;color:var(--sub);margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
.modal>div.wide{max-width:780px}
.helpbtn{position:absolute;top:36px;right:16px}
.land{position:relative}
.p-help{text-align:center;margin:14px 0 0;font-size:.88rem}
.p-help a{color:var(--sub);font-weight:700}
.sfx-lock{position:fixed;left:16px;bottom:16px;z-index:6;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
@keyframes drum{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-8deg) scale(1)}}
.st-big b.drum{animation:drum .18s infinite;color:#fff}
.vol{display:flex;align-items:center;gap:10px;margin:-4px 0 12px 28px}
.vol input{flex:1;accent-color:var(--brand)}
img[data-img]:not([src]){visibility:hidden}
/* stage images */
.st-qrow{display:flex;gap:2.6cqw;align-items:center;margin:0 0 2.2cqh}
.st-qrow .st-q{flex:1;text-align:left;margin:0}
.st-qimg{height:24cqh;width:40cqh;flex:none;border-radius:1.6cqh;overflow:hidden;background:rgba(255,255,255,.08)}
.st-qimg.big{height:44cqh;width:72cqh}
.st-qimg.sm{height:17cqh;width:28cqh}
.cl-img .noimg{display:flex;height:100%;align-items:center;justify-content:center;color:var(--c);font-weight:900}
.st-qimg img{width:100%;height:100%;object-fit:contain;display:block}
.tiles.img{align-content:stretch;grid-auto-rows:1fr}
.tile.timg{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;padding:1.1cqh;min-height:0}
.tile.timg b{font-size:min(2.9cqw,4.8cqh);padding:.7cqh .5cqw .2cqh;line-height:1.15}
.ti{flex:1;min-height:0;border-radius:1.4cqh;overflow:hidden;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center}
.ti img{width:100%;height:100%;object-fit:contain;display:block}
.fit-cover img{object-fit:cover!important}
.ti .noimg{font-size:min(5cqw,9cqh);font-weight:900;color:var(--c)}
.cl-img{height:12cqh;border-radius:1cqh;overflow:hidden;background:rgba(255,255,255,.94);margin-bottom:.8cqh}
.cl-img img{width:100%;height:100%;object-fit:contain;display:block}
/* phone images */
.p-qimg{position:relative;border-radius:14px;overflow:hidden;background:#fff;margin:0 0 12px;max-height:30vh;display:flex;justify-content:center}
.p-qimg img{max-width:100%;max-height:30vh;object-fit:contain;display:block}
.p-qimg.small,.p-qimg.small img{max-height:20vh}

function compressImage(file, maxEdge, quality) {

}

    },
    seikai(t) { [0, 0.42].forEach(o => { bell(t + o, 988, 0.5, 0.3); bell(t + o + 0.16, 784, 0.7, 0.3); }); },
    fuseikai(t) { const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(master); tone(t, 140, 0.9, { type: 'sawtooth', gain: 0.35, out: lp, attack: 0.01 }); },
    tick(t, fast) { tone(t, fast ? 1400 : 1100, 0.05, { type: 'square', gain: 0.08 }); },
  };
  const LOG = /[?&]sfxlog/.test(location.search) ? (window.__sfxLog = []) : null;
  const log = (a, n, src) => { if (LOG) LOG.push([Math.round(performance.now()), a, n, src]); };
  function play(name) {
    if (!enabled() || !ensure() || ctx.state !== 'running') return;
    log('play', name, bufs[name] ? 'file' : 'synth');
    master.gain.value = volume() ** 1.5;
    const b = bufs[name];
    if (b) {
      const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = b; src.connect(g).connect(master); src.start();
      shots[name] = { src, g }; src.onended = () => { if (shots[name] && shots[name].src === src) delete shots[name]; };
    } else if (SYN[name]) SYN[name](ctx.currentTime + 0.02);
  }
  function stop(name) { const o = shots[name]; if (!o || !ctx) return; try { o.g.gain.setTargetAtTime(0, ctx.currentTime, 0.05); o.src.stop(ctx.currentTime + 0.3); } catch {} delete shots[name]; }
  function stopLoop() {
    if (!loopNode) return; log('stopLoop', loopNode.name);
    if (loopNode.iv) clearInterval(loopNode.iv);
    else { try { loopNode.g.gain.setTargetAtTime(0, ctx.currentTime, 0.03); loopNode.src.stop(ctx.currentTime + 0.2); } catch {} }
    loopNode = null;
  }
  function loop(name) {
    stopLoop(); if (!enabled() || !ensure() || ctx.state !== 'running') return;
    master.gain.value = volume() ** 1.5; log('loop', name, bufs[name] ? 'file' : 'synth');
    const b = bufs[name];
    if (b) {
      const st = onsetOf(b), src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = b; src.loop = true; src.loopStart = st; src.loopEnd = Math.min(b.duration, st + (LOOP_LEN[name] || b.duration));
      src.connect(g).connect(master); src.start(ctx.currentTime, st); loopNode = { src, g, name };
    } else {
      const fast = name === 'timer_fast', per = fast ? 0.2 : 0.4; let t = ctx.currentTime + 0.02;
      const iv = setInterval(() => { while (t < ctx.currentTime + 0.4) { SYN.tick(t, fast); t += per; } }, 100); loopNode = { iv, name };
    }
  }
  function refresh() { if (master) master.gain.value = volume() ** 1.5; if (!enabled()) { stopLoop(); Object.keys(shots).forEach(stop); } }
  return { preload, unlock, running, play, stop, loop, stopLoop, refresh, enabled, volume, looping: () => !!loopNode };
})();
window.addEventListener('storage', e => { if (e.key === SFX_ON_KEY || e.key === SFX_VOL_KEY) SFX.refresh(); });

/* =========================================================
   サーバーとのやりとり
   おためし版（このブラウザの中だけ）と Supabase 版で同じ形にしてある
   ========================================================= */
function makeLocalServer() {
  const KEY = 'evapp_demo_db_v1';
  const load = () => { const db = store.get(KEY, { rooms: {} }); const now = Date.now(); for (const c in db.rooms) if (now - db.rooms[c].created_at > DAY) delete db.rooms[c]; return db; };
  const save = db => store.set(KEY, db);
  const room = (db, code) => db.rooms[String(code || '').toUpperCase()];
  const auth = (db, code, secret) => { const r = room(db, code); return r && r.secret === secret ? r : null; };
  const ok = o => ({ ok: true, server_now: Date.now(), ...o });
  const ng = e => ({ ok: false, error: e, server_now: Date.now() });
  const newPin = () => String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  function tally(r, runId, withNames) {
    const run = r.runs[runId]; if (!run) return null;
    const n = run.options.length, counts = Array(n).fill(0), names = withNames ? Array.from({ length: n }, () => []) : null;
    const entries = Object.entries(r.votes[runId] || {}).sort((a, b) => a[1].t - b[1].t);
    for (const [k, v] of entries) { counts[v.c]++; if (names) { const p = r.participants[k]; if (p) names[v.c].push(p.name); } }
    return { counts, total: entries.length, names };
  }
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('evapp-demo') : null;
  const subs = new Map();
  if (bc) bc.onmessage = e => { const s = subs.get(e.data && e.data.code); if (s) s.forEach(f => f()); };
  return {
    demo: true,
    async createRoom({ title, anon }) {
      const db = load(); let code; do { code = uid(6).toUpperCase(); } while (db.rooms[code]);
      const r = { code, pin: newPin(), secret: uid(24), title: (title || '').slice(0, 60), anon_mode: anon, state: { phase: 'waiting', rev: 1 }, created_at: Date.now(), participants: {}, runs: {}, votes: {}, questions: [], qrev: 0 };
      db.rooms[code] = r; save(db); return ok({ code, pin: r.pin, secret: r.secret });
    },
    async opState(code, secret) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      return ok({ room: { code: r.code, pin: r.pin, title: r.title, anon_mode: r.anon_mode, state: r.state, created_at: r.created_at, qrev: r.qrev || 0 }, participants: Object.keys(r.participants).length });
    },
    async setState(code, secret, state, duration, run) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      const st = { ...state };
      if (run && !r.runs[run.id]) r.runs[run.id] = { question: run.question, options: run.options, settings: run.settings || {}, started_at: Date.now() };
      if (duration > 0) st.ends_at = Date.now() + duration * 1000;
      st.rev = (r.state.rev || 0) + 1; r.state = st; save(db); return ok({ state: st });
    },
    async regenPin(code, secret) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      let p; do { p = newPin(); } while (p === r.pin); r.pin = p; save(db); return ok({ pin: p });
    },
    async publicState(code) {
      const r = room(load(), code); if (!r) return ng('no_room');
      const o = { title: r.title, anon_mode: r.anon_mode, state: r.state };
      if (r.state.phase === 'result' && r.state.run && r.state.run.phoneResult) o.results = tally(r, r.state.run.id, false);
      return ok(o);
    },
    async removeBots(code, secret) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      let n = 0;
      for (const k of Object.keys(r.participants)) if (k.startsWith('bot-')) { delete r.participants[k]; n++; }
      for (const v of Object.values(r.votes)) for (const k of Object.keys(v)) if (k.startsWith('bot-') || k.startsWith('vtbot-')) delete v[k];
      save(db); return ok({ removed: n });
    },
    async setTitle(code, secret, title) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      r.title = String(title || '').trim().slice(0, 60); save(db); return ok({ title: r.title });
    },
    async putImage(code, secret, id, data) {
      if (!auth(load(), code, secret)) return ng('no_room');
      try { localStorage.setItem('evapp_demo_img_' + id, data); return ok({ id }); } catch { return ng('storage_full'); }
    },
    async getImage(code, id) { try { const d = localStorage.getItem('evapp_demo_img_' + id); return d ? ok({ data: d }) : ng('no_image'); } catch { return ng('no_image'); } },
    async getQuestions(code, secret) { const r = auth(load(), code, secret); if (!r) return ng('no_room'); return ok({ questions: r.questions || [], qrev: r.qrev || 0 }); },
    async setQuestions(code, secret, qs) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      if (!Array.isArray(qs) || qs.length > 300) return ng('too_many');
      r.questions = qs; r.qrev = (r.qrev || 0) + 1; save(db); return ok({ qrev: r.qrev });
    },
    async join(code, pin, device, name) {
      name = String(name || '').trim(); if (!name || name.length > 20) return ng('bad_name');
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      if (r.pin !== pin) return ng('bad_pin');
      r.participants[device] = { name }; save(db); return ok({});
    },
    async vote(code, device, voterKey, runId, choice) {
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      if (!r.participants[device]) return ng('not_joined');
      const st = r.state;
      if (st.phase !== 'open' || !st.run || st.run.id !== runId) return ng('closed');
      if (st.ends_at && Date.now() > st.ends_at + 1500) return ng('closed');
      if (!(choice >= 0 && choice < st.run.options.length)) return ng('bad_choice');
      const key = r.anon_mode === 'full' ? voterKey : device;
      (r.votes[runId] ||= {})[key] = { c: choice, t: Date.now() }; save(db); return ok({});
    },
    async results(code, secret, runId) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      const t = tally(r, runId, r.anon_mode !== 'full'); if (!t) return ng('no_run');
      return ok({ ...t, participants: Object.keys(r.participants).length });
    },
    async exportAll(code, secret) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      const runs = Object.entries(r.runs).sort((a, b) => a[1].started_at - b[1].started_at)
        .map(([id, x]) => ({ run_id: id, question: x.question, options: x.options, settings: x.settings || {}, started_at: x.started_at, ...tally(r, id, r.anon_mode !== 'full') }));
      return ok({ title: r.title, anon_mode: r.anon_mode, runs });
    },
    async closeRoom(code, secret) { const db = load(); if (auth(db, code, secret)) delete db.rooms[code.toUpperCase()]; save(db); return ok({}); },
    subscribe(code, cb) { if (!subs.has(code)) subs.set(code, new Set()); subs.get(code).add(cb); setTimeout(cb, 0); },
    ping(code) { if (bc) bc.postMessage({ code }); },
  };
}

async function makeSupaServer() {
  await loadScript(SUPA_SRC);
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  async function rpc(fn, args) {
    const t0 = Date.now();
    try {
      const { data, error } = await sb.rpc(fn, args); const t1 = Date.now();
      if (error) return { ok: false, error: 'server', detail: error.message };
      if (data && data.server_now) Clock.sync(Number(data.server_now), t0, t1);
      return data || { ok: false, error: 'server' };
    } catch (e) { return { ok: false, error: 'network', detail: String(e) }; }
  }
  const chans = new Map();
  return {
    demo: false,
    createRoom: ({ password, title, anon }) => rpc('ev_create_room', { p_password: password, p_title: title, p_anon: anon }),
    opState: (c, s) => rpc('ev_op_state', { p_code: c, p_secret: s }),
    setState: (c, s, state, dur, run) => rpc('ev_set_state', { p_code: c, p_secret: s, p_state: state, p_duration: dur || 0, p_run: run || null }),
    regenPin: (c, s) => rpc('ev_regen_pin', { p_code: c, p_secret: s }),
    publicState: c => rpc('ev_public_state', { p_code: c }),
    join: (c, pin, d, name) => rpc('ev_join', { p_code: c, p_pin: pin, p_device: d, p_name: name }),
    vote: (c, d, vk, run, ch) => rpc('ev_vote', { p_code: c, p_device: d, p_voter_key: vk, p_run_id: run, p_choice: ch }),
    results: (c, s, run) => rpc('ev_results', { p_code: c, p_secret: s, p_run_id: run }),
    exportAll: (c, s) => rpc('ev_export', { p_code: c, p_secret: s }),
    closeRoom: (c, s) => rpc('ev_close_room', { p_code: c, p_secret: s }),
    setTitle: (c, s, t) => rpc('ev_set_title', { p_code: c, p_secret: s, p_title: t }),
    putImage: (c, s, id, data) => rpc('ev_put_image', { p_code: c, p_secret: s, p_id: id, p_data: data }),
    getImage: (c, id) => rpc('ev_get_image', { p_code: c, p_id: id }),
    removeBots: (c, s) => rpc('ev_remove_bots', { p_code: c, p_secret: s }),
    getQuestions: (c, s) => rpc('ev_get_questions', { p_code: c, p_secret: s }),
    setQuestions: (c, s, q) => rpc('ev_set_questions', { p_code: c, p_secret: s, p_questions: q }),
    // リアルタイム通信は「変わったよ」の合図だけ。中身はかならずサーバーに取りに行く（いたずら合図対策）
    subscribe(code, cb) {
      const ch = sb.channel('evapp-' + code, { config: { broadcast: { self: false } } });
      ch.on('broadcast', { event: 'ping' }, () => cb()).subscribe(st => { if (st === 'SUBSCRIBED') cb(); });
      chans.set(code, ch);
    },
    ping(code) { const ch = chans.get(code); if (ch) Promise.resolve(ch.send({ type: 'broadcast', event: 'ping', payload: {} })).catch(() => {}); },
  };
}

}

/* =========================================================
   部屋の様子を見張る係（マスター画面とモニタ画面で共通）
   ========================================================= */
function makeWatcher(code, secret, onUpdate) {
  const w = { room: null, participants: 0, results: null, resultsRun: null, gone: false, err: null };
  let busyOp = false, busyRes = false, stopped = false;
  async function fetchOp() {
    if (busyOp) return; busyOp = true;
    const res = await API.opState(code, secret); busyOp = false;
    if (res.ok) {
      const prevRev = w.room && w.room.state && w.room.state.rev;
      w.room = res.room; w.participants = Number(res.participants) || 0; w.err = null;
      if (res.room.state && res.room.state.run && res.room.state.rev !== prevRev) fetchRes();
    } else if (res.error === 'no_room') w.gone = true;
    else w.err = res.error;
    onUpdate(w);
  }
  async function fetchRes() {
    const st = w.room && w.room.state; if (!st || !st.run || busyRes) return;
    busyRes = true; const runId = st.run.id;
    const res = await API.results(code, secret, runId); busyRes = false;
    if (res.ok) { w.results = res; w.resultsRun = runId; w.participants = Number(res.participants) || w.participants; onUpdate(w); }
  }
  API.subscribe(code, fetchOp);
  (async () => {
    let i = 0;
    while (!stopped) {
      await sleep(1000); i++;
      const st = w.room && w.room.state;
      if (st && st.phase === 'open') fetchRes();
      if (i % 3 === 0 || !w.room) fetchOp();
    }
  })();
  w.refresh = fetchOp; w.refreshResults = fetchRes; w.stop = () => { stopped = true; };
  fetchOp();
  return w;
}

/* =========================================================
   ステージ（モニタに映す画面）— 表示用ウィンドウとマスターのプレビューで共通
   ========================================================= */
function makeStage(el, getW, joinUrl) {
  el.classList.add('stage');
  let key = '';
  function screenOf(st) {
    if (!st || st.phase === 'waiting' || !st.run) return 'waiting';
    if (st.phase === 'open') return st.ends_at && Clock.now() >= st.ends_at ? 'closing' : 'open';
    if (st.phase === 'result') return st.reveal_at && Clock.now() < st.reveal_at ? 'rolling' : 'result';
    return 'closed';
  }
  function foot(room, run) {
    return `<div class="st-foot"><span>${run && run.showCount ? `回答 <b data-tot>0</b> / <b data-pc>0</b>人` : ''}</span><span class="st-mode">${modeOf(room.anon_mode).icon} ${modeOf(room.anon_mode).name}</span></div>`;
  }
  function cols(run, withNames) {
    return `<div class="cols" style="--n:${run.options.length}">${run.options.map((o, i) => `
      <div class="col" data-i="${i}" style="--c:${colorOf(i)}">
        <div class="col-top"><span data-cnt>0</span><small>人</small></div>
        <div class="col-pct" data-pct>0%</div>
        <div class="col-track"><div class="col-fill" data-fill></div></div>
        <div class="col-label">${hasOptImgs(run) ? `<div class="cl-img ${run.imgFit === 'cover' ? 'fit-cover' : ''}">${run.optImgs[i] ? imgTag(run.optImgs[i]) : `<span class="noimg">${esc(o)}</span>`}</div>` : ''}${esc(o)}</div>
        ${withNames ? '<div class="col-names" data-names></div>' : ''}
      </div>`).join('')}</div>`;
  }
  function tiles(run) {
    const n = run.options.length, c = n <= 3 ? n : n === 4 ? 2 : 3;
    if (hasOptImgs(run)) return `<div class="tiles img" style="--cols:${c}">${run.options.map((o, i) => { const id = run.optImgs[i];
      return `<div class="tile timg" style="--c:${colorOf(i)}"><div class="ti ${run.imgFit === 'cover' ? 'fit-cover' : ''}">${id ? imgTag(id) : `<span class="noimg">${esc(o)}</span>`}</div><b>${esc(o)}</b></div>`; }).join('')}</div>`;
    return `<div class="tiles" style="--cols:${c}">${run.options.map((o, i) => `<div class="tile" style="--c:${colorOf(i)}">${esc(o)}</div>`).join('')}</div>`;
  }
  function timer() { return `<div class="st-timer" data-timer><div class="st-bar"><i data-bar></i></div><div class="st-sec" data-sec></div></div>`; }
  function build(screen, room, st) {
    const run = st && st.run;
    if (screen === 'waiting') {
      const qr = qrDataUrl(joinUrl);
      return `<div class="st"><div class="st-title">${esc(room.title || 'アンケート')}</div>
        <div class="st-join">
          ${qr ? `<div class="st-qr"><img src="${qr}" alt="参加用QRコード"></div>` : ''}
          <div><div class="st-lead">スマホで${qr ? 'QRコードを読みこんで' : '下のURLを開いて'}<br>参加してね！</div>
            <div class="st-pinlabel">カギの数字</div><div class="st-pin">${esc(room.pin)}</div>
            <div class="st-url">${esc(joinUrl)}</div>${DEMO ? '<div class="st-demo">🧪 おためしモード：このPCの中だけで動いています（スマホからは参加できません）</div>' : ''}</div>
        </div>
        <div class="st-foot"><span class="st-count">🙋 <b data-pc>0</b>人 参加中</span><span class="st-mode">${modeOf(room.anon_mode).icon} ${modeOf(room.anon_mode).name}：${modeOf(room.anon_mode).desc}</span></div></div>`;
    }
    const q = run.img ? `<div class="st-qrow"><div class="st-qimg ${hasOptImgs(run) ? 'sm' : 'big'}">${imgTag(run.img)}</div><div class="st-q" data-fit>${esc(run.question)}</div></div>`
      : `<div class="st-q" data-fit>${esc(run.question)}</div>`;
    const live = run.reveal === 'live';
    if (screen === 'open' || (screen === 'closing' && live)) return `<div class="st">${q}${timer()}${live ? cols(run, false) : tiles(run)}${foot(room, run)}</div>`;
    if (screen === 'rolling') return `<div class="st">${q}<div class="st-big"><b class="drum">🥁</b><span>結果発表…！</span></div>${foot(room, run)}</div>`;
    if (screen === 'closing' || screen === 'closed') return `<div class="st">${q}<div class="st-big"><b>締め切り！</b><span>${screen === 'closed' ? '結果発表をお待ちください…' : '集計中…'}</span></div>${foot(room, run)}</div>`;
    return `<div class="st"><div class="st-q small" data-fit>${esc(run.question)}</div>${cols(run, room.anon_mode === 'named')}${foot(room, run)}</div>`;
  }
  function fit() {
    $$('[data-fit]', el).forEach(q => {
      q.style.fontSize = '';
      const inRow = !!q.closest('.st-qrow'), big = inRow && q.closest('.st-qrow').querySelector('.st-qimg.big');
      const maxH = el.clientHeight * (q.classList.contains('small') ? 0.16 : (!inRow && el.querySelector('.tiles.img')) ? 0.17 : inRow ? (big ? 0.42 : 0.17) : 0.3);
      let fs = parseFloat(getComputedStyle(q).fontSize), guard = 0;
      while (q.scrollHeight > maxH && fs > 10 && guard++ < 30) { fs *= 0.92; q.style.fontSize = fs + 'px'; }
    });
  }
  function fill(w, screen) {
    $$('[data-pc]', el).forEach(e => e.textContent = w.participants);
    const st = w.room.state, run = st && st.run;
    const res = run && w.resultsRun === run.id ? w.results : null;
    if (run && res) {
      $$('[data-tot]', el).forEach(e => e.textContent = res.total);
      const counts = res.counts || [], tot = Math.max(1, res.total), top = Math.max(0, ...counts), max = Math.max(1, top);
      $$('.col', el).forEach(c => {
        const i = +c.dataset.i, v = counts[i] || 0;
        $('[data-cnt]', c).textContent = v;
        $('[data-pct]', c).textContent = Math.round(v * 100 / tot) + '%';
        $('[data-fill]', c).style.height = (v / max * 100) + '%';
        c.classList.toggle('win', screen === 'result' && v === top && v > 0);
        const nm = $('[data-names]', c);
        if (nm && res.names) { const l = res.names[i] || []; nm.textContent = l.slice(0, 40).join('、') + (l.length > 40 ? ` ほか${l.length - 40}人` : ''); }
      });
    }
    const t = $('[data-timer]', el);
    if (t && run) {
      const bar = $('[data-bar]', t), sec = $('[data-sec]', t);
      if (st.ends_at) {
        const rem = Math.max(0, st.ends_at - Clock.now()), total = Math.max(1, (run.duration || 1) * 1000);
        bar.style.width = Math.min(100, rem / total * 100) + '%';
        const s = Math.ceil(rem / 1000);
        t.classList.toggle('hurry', rem > 0 && rem <= 5000); t.classList.toggle('over', rem <= 0);
        sec.innerHTML = rem <= 0 ? '締め切り！' : `${fmtSec(s)}${s < 60 ? '<small>秒</small>' : ''}`;
      } else { t.classList.add('nolimit'); sec.innerHTML = '<small>回答受付中</small>'; }
    }
  }
  function update() {
    const w = getW();
    if (!w || !w.room) {
      const k = w && w.gone ? 'gone' : 'load';
      if (key !== k) { key = k; el.innerHTML = `<div class="st"><div class="st-big"><span>${k === 'gone' ? 'この部屋は終了しました' : '接続中…'}</span></div></div>`; }
      return;
    }
    const st = w.room.state || { phase: 'waiting' }, run = st.run, screen = screenOf(st);
    const k = [screen, run && run.id, run && run.reveal, run && run.showCount, w.room.pin, w.room.title, qrReady, el.clientWidth > 0].join('|');
    if (k !== key) {
      key = k; el.innerHTML = build(screen, w.room, st); hydrateImgs(el); fit();
      requestAnimationFrame(() => fill(w, screen));
    } else fill(w, screen);
  }
  window.addEventListener('resize', () => { key = ''; update(); });
  return { update, reset() { key = ''; } };
}

/* =========================================================
   モニタ表示用ウィンドウ
   ========================================================= */
function displayView(code) {
  document.body.className = 'v-disp'; IMG_ROOM = code;
  const secret = new URLSearchParams(location.hash.slice(1)).get('k') || ((myRooms().find(r => r.code === code) || {}).secret);
  if (!secret) { document.body.className = ''; $('#app').innerHTML = msgPage('🖥', '表示用のカギがありません', 'マスター画面の「表示用ウィンドウを開く」か「表示用URL」から開いてください。'); return; }
  document.title = 'モニタ表示 - みんなでポチッ';
  const el = document.createElement('div'); $('#app').appendChild(el);
  let w = null;
  const stage = makeStage(el, () => w, pageUrl({ r: code }));
  w = makeWatcher(code, secret, () => { stage.update(); soundTick(); });
  // ---- 効果音 ----
  SFX.preload();
  const lock = document.createElement('button'); lock.className = 'sfx-lock'; lock.textContent = '🔇 クリックして音をオンにする'; lock.hidden = true; document.body.appendChild(lock);
  const unlock = () => { SFX.unlock(); setTimeout(updLock, 300); };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlock, { passive: true }));
  function updLock() { lock.hidden = !SFX.enabled() || SFX.running(); }
  const sd = { inited: false, runId: null, phase: null, loop: null, gongRun: null, rollKey: null, endKey: null };
  function soundTick() {
    if (!w || !w.room) return;
    const st = w.room.state || {}, run = st.run, now = Clock.now();
    if (!sd.inited) {
      sd.inited = true; sd.runId = run ? run.id : null; sd.phase = st.phase;
      sd.gongRun = st.phase === 'open' ? null : (run ? run.id : null); sd.rollKey = sd.endKey = st.rk || null;
    }
    let want = null;
    if (st.phase === 'open' && run) {
      if (run.id !== sd.runId) { sd.runId = run.id; sd.gongRun = null; SFX.play('shutsudai'); }
      if (st.ends_at) {
        const rem = st.ends_at - now;
        if (rem > 10000) want = 'timer'; else if (rem > 0) want = 'timer_fast';
        else if (sd.gongRun !== run.id) { sd.gongRun = run.id; SFX.stopLoop(); sd.loop = null; SFX.play('gong'); }
      }
    }
    if ((st.phase === 'closed' || st.phase === 'result') && run && sd.phase === 'open' && run.id === sd.runId && sd.gongRun !== run.id) { sd.gongRun = run.id; SFX.play('gong'); }
    if (!SFX.enabled()) want = null;
    if (want !== sd.loop || (want && !SFX.looping() && SFX.running())) { sd.loop = want; if (want) SFX.loop(want); else SFX.stopLoop(); }
    if (st.phase === 'result' && run && st.rk) {
      if (st.rk !== sd.rollKey) { sd.rollKey = st.rk; if (st.reveal_at && now < st.reveal_at) SFX.play('roll'); }
      if (st.rk !== sd.endKey && (!st.reveal_at || now >= st.reveal_at)) { sd.endKey = st.rk; SFX.stop('roll'); SFX.play('roll_end'); }
    }
    sd.phase = st.phase;
  }
  setInterval(() => { stage.update(); soundTick(); updLock(); }, 250);
  document.addEventListener('qrready', () => { stage.reset(); stage.update(); });
  // 全画面とカーソル
  const hint = document.createElement('div'); hint.className = 'st-hint'; hint.textContent = 'ダブルクリック（または F キー）で全画面'; document.body.appendChild(hint);
  setTimeout(() => hint.style.opacity = 0, 4000);
  const fs = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
  document.addEventListener('dblclick', fs);
  document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); });
}

function participantView(code) {

  const S = DEMO ? sstore : store; // おためし版はタブごとに別の人になる

  const jKey = 'evapp_join_' + code, vtKey = 'evapp_vt_' + code, mvKey = 'evapp_myvotes_' + code;

  let voteToken = S.get(vtKey); if (!voteToken) { voteToken = 'v-' + uid(16); S.set(vtKey, voteToken); }
  let myVotes = S.get(mvKey, {});
  let pub = null, key = '', offline = false, lastRun = null;

  const off = document.createElement('div'); off.className = 'p-off'; off.textContent = '通信できません…再接続中'; document.body.appendChild(off);

  async function refresh() {
    const res = await API.publicState(code);
    if (res.ok) { pub = res; offline = false; }
    else if (res.error === 'no_room') pub = { gone: true };
    else offline = true;
    off.classList.toggle('show', offline);
    render();
  }
  function head() {
    const m = modeOf(pub.anon_mode);
    return `<div class="p-head"><div class="p-title">${esc(pub.title || 'アンケート')}</div>${joined ? `<div class="p-name">👤 ${esc(joined.name)}</div>` : ''}</div>
      <div class="p-mode">${m.icon} <b>${m.name}</b>：${m.desc}</div>`;
  }
  function render() {
    if (!pub) { if (key !== 'load') { key = 'load'; app.innerHTML = `<div class="p-wrap"><div class="p-main p-center"><div class="dots"><i></i><i></i><i></i></div></div></div>`; } return; }
    if (pub.gone) { if (key !== 'gone') { key = 'gone'; app.innerHTML = DEMO
      ? msgPage('🧪', 'いまは「おためしモード」です', 'おためしモードは、部屋をつくったPCのブラウザの中だけで動きます。別のスマホやPCから参加するには、マスターがサーバー（Supabase）につないで本番モードにしてください。', false)
      : msgPage('🚪', '部屋が見つかりません', 'アンケートは終了したか、URLがちがうようです。', false); } return; }
    if (!joined) return renderJoin();
    const st = pub.state || {}, run = st.run;
    const expired = st.phase === 'open' && st.ends_at && Clock.now() >= st.ends_at;
    const screen = !run || st.phase === 'waiting' ? 'waiting' : st.phase === 'open' && !expired ? 'open' : 'closed';
    const my = run ? myVotes[run.id] : undefined;
    const rolling = st.phase === 'result' && st.reveal_at && Clock.now() < st.reveal_at;
    const k = [screen, st.rev, my, st.phase, rolling, pub.title, pub.results ? JSON.stringify(pub.results.counts) + pub.results.total : ''].join('|');
    if (k === key) return tick();
    key = k;
    if (screen === 'open' && run.id !== lastRun) { lastRun = run.id; try { navigator.vibrate && navigator.vibrate(60); } catch {} window.scrollTo(0, 0); }
    let main;
    if (screen === 'waiting') {
      main = `<div class="p-main p-center"><div class="big">🙌</div><h2>参加できました！</h2><p>アンケートが始まるまで、少々お待ちください</p><p style="margin-top:18px"><span class="dots"><i></i><i></i><i></i></span></p><p class="p-help"><a href="#" data-phelp>❓ 参加のしかた</a></p></div>`;
    } else if (screen === 'open') {
      const n = run.options.length, has = my !== undefined, showImg = run.phoneImg !== false, optI = showImg && hasOptImgs(run);
      main = `<div class="p-main">
        ${showImg && run.img ? `<div class="p-qimg ${optI ? 'small' : ''}">${imgTag(run.img)}<span class="zoom" data-zoom="${run.img}">🔍</span></div>` : ''}
        <div class="p-q">${esc(run.question)}</div>
        <div class="p-timer" id="pTimer"><div class="bar"><i id="pBar"></i></div><span id="pSec"></span></div>
        <div class="p-opts n${n} ${has ? 'has' : ''} ${optI ? 'imgs' : ''}">${run.options.map((o, i) => optI
          ? `<button class="opt ${my === i ? 'sel' : ''}" data-i="${i}" style="--c:${colorOf(i)}"><div class="oi ${run.imgFit === 'cover' ? 'fit-cover' : ''}">${run.optImgs[i] ? imgTag(run.optImgs[i]) + `<span class="zoom" data-zoom="${run.optImgs[i]}">🔍</span>` : `<span class="noimg">${esc(o)}</span>`}</div><span>${my === i ? '✓ ' : ''}${esc(o)}</span></button>`
          : `<button class="opt ${my === i ? 'sel' : ''}" data-i="${i}" style="--c:${colorOf(i)}">${esc(o)}</button>`).join('')}</div>
        <div class="p-note ${has ? 'done' : ''}">${has ? '✓ 回答しました。締め切りまで変えられます' : 'ボタンをタップして回答してください'}</div>
      </div>`;
    } else if (rolling) {
      main = `<div class="p-main p-center"><div class="big" style="animation:drum .18s infinite">🥁</div><h2>結果発表…！</h2><p>${esc(run.question)}</p><p style="margin-top:20px">モニタに注目！</p></div>`;
    } else if (st.phase === 'result' && pub.results && Array.isArray(pub.results.counts)) {
      const c = pub.results.counts, tot = pub.results.total || 0, max = Math.max(1, ...c), top = Math.max(0, ...c);
      main = `<div class="p-main"><div style="text-align:center;font-size:2rem">🎉</div><div class="p-q">${esc(run.question)}</div>
        <div class="p-res">${run.options.map((o, i) => `<div class="ores-row ${my === i ? 'mine' : ''} ${c[i] === top && top > 0 ? 'win' : ''}" style="--c:${colorOf(i)}"><span class="ores-lab">${c[i] === top && top > 0 ? '👑 ' : ''}${esc(o)}</span><span class="ores-bar"><i style="width:${(c[i] || 0) / max * 100}%"></i></span><span class="ores-n">${c[i] || 0}人 <small>${tot ? Math.round((c[i] || 0) * 100 / tot) : 0}%</small></span></div>`).join('')}</div>
        <div class="p-res-note">回答 ${tot}人${my !== undefined ? `　／　あなたの回答：${esc(run.options[my])}` : ''}</div></div>`;
    } else {
      const ans = my !== undefined ? run.options[my] : null;
      main = `<div class="p-main p-center"><div class="big">${st.phase === 'result' ? '🎉' : '⏰'}</div>
        <h2>${st.phase === 'result' ? '結果発表中！' : '締め切りました'}</h2>
        <p>${esc(run.question)}</p>
        ${ans != null ? `<div class="p-answer" style="--c:${colorOf(my)}">あなたの回答：${esc(ans)}</div>` : `<p style="margin-top:12px"><b>回答しませんでした</b></p>`}
        <p style="margin-top:20px">${st.phase === 'result' ? '結果はモニタを見てね！' : 'モニタに注目！'}</p></div>`;
    }
    app.innerHTML = `<div class="p-wrap">${head()}${main}</div>`;
    $$('.opt', app).forEach(b => b.onclick = e => { const z = e.target.closest('[data-zoom]'); if (z) { e.stopPropagation(); zoomImg(z.dataset.zoom); return; } choose(+b.dataset.i); });
    $$('.p-qimg [data-zoom]', app).forEach(z => z.onclick = () => zoomImg(z.dataset.zoom));
    $$('[data-phelp]', app).forEach(a => a.onclick = e => { e.preventDefault(); showHelp(true); });
    hydrateImgs(app);
    tick();
  }
  function tick() {
    const t = $('#pTimer'); if (!t || !pub || !pub.state) return;
    const st = pub.state, run = st.run;
    if (st.ends_at) {
      const rem = Math.max(0, st.ends_at - Clock.now());
      $('#pBar').style.width = Math.min(100, rem / Math.max(1, run.duration * 1000) * 100) + '%';
      $('#pSec').textContent = `のこり ${fmtSec(Math.ceil(rem / 1000))}${rem < 60000 ? '秒' : ''}`;
      t.classList.toggle('hurry', rem <= 5000);
    } else { t.classList.add('nolimit'); $('#pSec').textContent = '制限時間なし'; }
  }
  async function choose(i) {
    const st = pub.state, run = st.run; if (!run) return;
    const prev = myVotes[run.id]; if (prev === i) return;
    myVotes[run.id] = i; saveVotes(); render();
    const res = await API.vote(code, device, voteToken, run.id, i);
    if (!res.ok) {
      if (myVotes[run.id] === i) { if (prev === undefined) delete myVotes[run.id]; else myVotes[run.id] = prev; saveVotes(); }
      if (res.error === 'not_joined') { joined = null; S.del(jKey); }
      toast(errMsg(res.error)); key = ''; refresh();
    }
  }
  function saveVotes() { const ks = Object.keys(myVotes); if (ks.length > 40) ks.slice(0, ks.length - 40).forEach(k => delete myVotes[k]); S.set(mvKey, myVotes); }
  function renderJoin() {
    if (key === 'join') return; key = 'join';
    app.innerHTML = `<div class="p-wrap p-join">${head()}
      <div class="card">
        <h3>🙋 参加する</h3>
        <label class="f"><span>名前（ニックネームでOK）</span><input id="jName" maxlength="20" autocomplete="nickname" placeholder="例：たろう"></label>
        <label class="f"><span>カギの数字（モニタに出ている4ケタ）</span><input id="jPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000"></label>
        <div class="p-err" id="jErr"></div>
        <button class="primary big" id="jGo" style="width:100%">参加する</button>
        <p class="p-help"><a href="#" id="jHelp">❓ 参加のしかた</a></p>
      </div></div>`;
    $('#jHelp').onclick = e => { e.preventDefault(); showHelp(true); };
    const last = store.get('evapp_lastname'); if (last) $('#jName').value = last;
    const go = async () => {
      const name = $('#jName').value.trim(), pin = $('#jPin').value.replace(/\D/g, '');
      if (!name) return $('#jErr').textContent = '名前を入れてください';
      if (pin.length !== 4) return $('#jErr').textContent = 'カギの数字は4ケタです';
      $('#jGo').disabled = true;
      const res = await API.join(code, pin, device, name);
      $('#jGo').disabled = false;
      if (!res.ok) return $('#jErr').textContent = errMsg(res.error);
      joined = { name }; S.set(jKey, joined); store.set('evapp_lastname', name);
      key = ''; refresh();
    };
    $('#jGo').onclick = go;
    $('#jPin').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  API.subscribe(code, refresh);
  setInterval(refresh, DEMO ? 4000 : 5000);
  setInterval(() => { if (!pub || pub.gone || !joined) return; const st = pub.state || {};
    if ((st.phase === 'open' && st.ends_at && Clock.now() >= st.ends_at) || (st.phase === 'result' && st.reveal_at)) render(); else tick(); }, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('online', refresh);
  refresh();
}

/* =========================================================
   イベント記録（履歴・記録ファイル・ブラウザの控え）
   ========================================================= */
const BACKUP_ON_KEY = 'evapp_autobackup';
const backupOn = () => store.get(BACKUP_ON_KEY, true) !== false;
const BK_PREFIX = DEMO ? 'evapp_bk_demo_' : 'evapp_bk_';
const strArr = (a, n, len) => (Array.isArray(a) ? a : []).slice(0, n).map(x => String(x ?? '').slice(0, len));
function cleanQuestion(q, keepId) {
  if (!q || typeof q !== 'object' || !BTN_TYPES[q.type]) return null;
  const c = { id: keepId && /^q[a-z0-9]{4,20}$/.test(q.id) ? q.id : 'q' + uid(8), text: String(q.text || '').slice(0, 200), type: q.type, count: Math.min(6, Math.max(2, q.count | 0 || 4)),
    labels: strArr(q.labels, 6, 24), duration: DURATIONS.some(d => d[0] === +q.duration) ? +q.duration : 30,
    reveal: q.reveal === 'live' ? 'live' : 'after', showCount: q.showCount !== false, phoneResult: q.phoneResult !== false,
    ...imgFieldsOf(q), imgQ: q.imgQ === 'high' ? 'high' : 'normal' };
  return buildOptions(c).length >= 2 ? c : null;
}
const cleanQuestions = (list, keepId) => (Array.isArray(list) ? list : []).slice(0, 300).map(q => cleanQuestion(q, keepId)).filter(Boolean);
function makeRecord(res, code) {
  return { app: 'minnade-pochi', kind: 'record', version: 1, code, title: res.title || '', anon_mode: res.anon_mode, saved_at: Date.now(),
    runs: (res.runs || []).map(x => ({ run_id: x.run_id, question: x.question, options: x.options, settings: x.settings || {}, started_at: x.started_at,
      counts: x.counts || [], total: x.total || 0, names: x.names || null })),
    questions: loadBank() };
}
function parseRecord(obj) {
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.runs)) return null;
  const runs = obj.runs.map(x => {
    if (!x || typeof x !== 'object') return null;
    const options = strArr(x.options, 6, 40); if (options.length < 2) return null;
    const counts = options.map((_, i) => Math.max(0, +((x.counts || [])[i]) || 0));
    const st = x.settings && typeof x.settings === 'object' ? x.settings : {};
    return { run_id: String(x.run_id || uid(8)), question: String(x.question || '').slice(0, 300), options, counts,
      total: Math.max(0, +x.total || counts.reduce((a, b) => a + b, 0)), started_at: +x.started_at || 0,
      names: Array.isArray(x.names) ? options.map((_, i) => strArr((x.names[i]), 2000, 40)) : null,
      settings: { type: BTN_TYPES[st.type] ? st.type : 'custom', duration: +st.duration || 0, reveal: st.reveal === 'live' ? 'live' : 'after', showCount: st.showCount !== false, phoneResult: st.phoneResult !== false, ...imgFieldsOf(st) } };
  }).filter(Boolean);
  return { app: 'minnade-pochi', kind: 'record', version: 1, code: String(obj.code || '').slice(0, 12), title: String(obj.title || '').slice(0, 60),
    anon_mode: MODES[obj.anon_mode] ? obj.anon_mode : 'full', saved_at: +obj.saved_at || Date.now(), runs, questions: cleanQuestions(obj.questions), images: sanitizeImages(obj.images) };
}
function saveBackup(rec) { if (rec && rec.code && rec.runs.length) { const { images, ...rest } = rec; store.set(BK_PREFIX + rec.code, rest); } }
function delBackup(code) { store.del(BK_PREFIX + code); }
function listBackups() {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('evapp_bk_')) { const r = store.get(k); if (r && r.runs) out.push({ ...r, _key: k, _demo: k.startsWith('evapp_bk_demo_') }); } } } catch {}
  return out.sort((a, b) => b.saved_at - a.saved_at);
}
function runToQuestion(run) {
  const st = run.settings || {};
  const base = { text: run.question, duration: st.duration || 0, reveal: st.reveal || 'after', showCount: st.showCount !== false, phoneResult: st.phoneResult !== false, ...imgFieldsOf(st) };
  const asType = { ...base, type: st.type, count: run.options.length };
  if (BTN_TYPES[st.type] && st.type !== 'custom' && buildOptions(asType).join('\u0001') === run.options.join('\u0001')) return asType;
  return { ...base, type: 'custom', count: run.options.length, labels: run.options.slice() };
}
function recordCsv(rec) {
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const withNames = rec.anon_mode !== 'full';
  const rows = [['番号', '質問', '開始時刻', '選択肢', '人数', '割合(%)', '回答者数'].concat(withNames ? ['名前'] : [])];
  rec.runs.forEach((x, k) => x.options.forEach((o, i) => rows.push([k + 1, x.question, x.started_at ? fmtTime(x.started_at) : '', o, x.counts[i] || 0,
    x.total ? Math.round((x.counts[i] || 0) * 1000 / x.total) / 10 : 0, x.total].concat(withNames ? [(x.names && x.names[i] || []).join('、')] : []))));
  return '\uFEFF' + rows.map(rw => rw.map(cell).join(',')).join('\r\n');
}
const fileStamp = () => { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`; };
const recName = (rec, ext) => `アンケート記録_${(rec.title || rec.code || 'event').replace(/[\\/:*?"<>|\s]+/g, '_')}_${fileStamp()}.${ext}`;
function runsHtml(rec, actions, nowId) {
  if (!rec.runs.length) return '<p class="muted" style="margin:0">まだ出題していません</p>';
  return rec.runs.map((run, k) => {
    const tot = run.total, max = Math.max(1, ...run.counts), st = run.settings || {};
    return `<div class="hrun ${run.run_id === nowId ? 'now' : ''}">
      <div class="hrun-h"><div class="hrun-q"><small>Q${k + 1}</small>${imgTag(st.img, 'othumb')}${esc(run.question)}</div><div class="hrun-acts">${actions ? actions(run, k) : ''}</div></div>
      <div class="chips" style="margin-bottom:6px">${run.run_id === nowId ? '<span class="chip live">🖥 モニタに表示中</span>' : ''}${run.started_at ? `<span class="chip">${fmtTime(run.started_at)}</span>` : ''}<span class="chip">${run.options.length}択</span>${st.duration ? `<span class="chip">⏱ ${durName(st.duration)}</span>` : ''}<span class="chip">回答 ${tot}人</span></div>
      ${run.options.map((o, i) => `<div class="ores-row" style="--c:${colorOf(i)}"><span class="ores-lab">${imgTag((st.optImgs || [])[i], 'othumb')}${esc(o)}</span><span class="ores-bar"><i style="width:${run.counts[i] / max * 100}%"></i></span><span class="ores-n">${run.counts[i]}人 <small>${tot ? Math.round(run.counts[i] * 100 / tot) : 0}%</small></span>
        ${run.names && run.names[i] && run.names[i].length ? `<div class="ores-names">${esc(run.names[i].join('、'))}</div>` : ''}</div>`).join('')}
    </div>`;
  }).join('');
}
function questionsFromFile(obj) {
  if (Array.isArray(obj)) return { questions: cleanQuestions(obj) };
  if (!obj || typeof obj !== 'object') return null;
  if (Array.isArray(obj.runs)) {
    const rec = parseRecord(obj); if (!rec) return null;
    let qs = rec.questions;
    if (!qs.length) { const seen = new Set(); qs = cleanQuestions(rec.runs.map(runToQuestion).filter(q => { const k = q.text + '\u0001' + buildOptions(q).join('\u0001'); if (seen.has(k)) return false; seen.add(k); return true; })); }
    return { questions: qs, title: rec.title, anon_mode: rec.anon_mode, images: rec.images };
  }
  if (Array.isArray(obj.questions)) return { questions: cleanQuestions(obj.questions), title: typeof obj.title === 'string' ? obj.title.slice(0, 40) : '', anon_mode: MODES[obj.anon_mode] ? obj.anon_mode : null, images: sanitizeImages(obj.images) };
  return null;
}
function importQuestions(list) {
  const clean = cleanQuestions(list); if (!clean.length) { toast('取りこめる質問がありません'); return 0; }
  saveBank(loadBank().concat(clean)); toast(`${clean.length}問を質問リストに取りこみました`); return clean.length;
}

/* =========================================================

    if (!res.ok) return toast(errMsg(res.error));
    if (w.room) w.room.title = res.title;
    const list = myRooms(); const e = list.find(x => x.code === code); if (e) { e.title = res.title; store.set(ROOMS_KEY, list); }
    API.ping(code); onUpdate(); stage.reset(); stage.update(); toast('部屋の名前を変えました');
  };
  $('#btnSet').onclick = () => {
    const m = openModal(`<h2>⚙️ 設定 <small class="muted" style="font-size:.8rem">（このPCのブラウザに覚えます）</small></h2>
      <label class="chk"><input type="checkbox" id="sDummy" ${dummyOn() ? 'checked' : ''}> 🧪 テスト用ダミーを使う</label>
      <p class="muted" style="font-size:.82rem;margin:-6px 0 14px 28px">進行タブにダミー参加者の箱が出ます。本番のときはオフに。</p>
      <label class="chk"><input type="checkbox" id="sBk" ${backupOn() ? 'checked' : ''}> 💾 このPCのブラウザに結果の控えを自動で残す</label>
      <p class="muted" style="font-size:.82rem;margin:-6px 0 14px 28px">保存し忘れても、トップの「このPCに残っている控え」から見られます。共用PCではオフに。</p>
      <label class="chk"><input type="checkbox" id="sSfx" ${SFX.enabled() ? 'checked' : ''}> 🔊 効果音を鳴らす（モニタ表示用ウィンドウから鳴ります）</label>
      <div class="vol">🔉 音量 <input type="range" id="sVol" min="0" max="100" value="${Math.round(SFX.volume() * 100)}"><span id="sVolV">${Math.round(SFX.volume() * 100)}</span><button class="mini" id="sTest">▶ ためしに鳴らす</button></div>
      <p class="muted" style="font-size:.82rem;margin:-6px 0 14px 28px">表示用ウィンドウが同じPCにあれば、ここで変えるとすぐ反映されます。別のPCのときは、そのPCで設定してください。</p>
      ${DEMO ? '' : `<p class="muted" style="font-size:.82rem">🔑 マスターパスワード：${store.get(PW_KEY) ? 'このPCに保存ずみ　<button class="mini" id="sPwDel">忘れる</button>' : '保存していません'}</p>`}
      <div class="row" style="justify-content:flex-end"><button class="primary" data-close>閉じる</button></div>`);
    $('#sDummy', m).onchange = e => { store.set(DUMMY_KEY, e.target.checked); applyDummy(); };
    $('#sBk', m).onchange = e => setBackup(e.target.checked);
    $('#sSfx', m).onchange = e => { store.set(SFX_ON_KEY, e.target.checked); SFX.refresh(); };
    $('#sVol', m).oninput = e => { store.set(SFX_VOL_KEY, +e.target.value / 100); $('#sVolV', m).textContent = e.target.value; SFX.refresh(); };
    $('#sTest', m).onclick = () => { SFX.unlock(); setTimeout(() => SFX.play('shutsudai'), 120); };
    const pd = $('#sPwDel', m); if (pd) pd.onclick = () => { store.del(PW_KEY); pd.parentNode.textContent = '🔑 マスターパスワード：保存していません'; toast('パスワードを忘れました'); };
  };
  async function refreshHistory() {
    if (histBusy) return; histBusy = true;
    const res = await API.exportAll(code, secret); histBusy = false;
    if (!res.ok) return;
    lastRec = makeRecord(res, code);
    if (backupOn()) saveBackup(lastRec);
    if (!$('#tabHist').hidden) renderHistory();
  }
  function renderHistory() {
    if (!lastRec) return;
    const st = cur(), nowId = st.run && st.phase !== 'waiting' ? st.run.id : null;
    const rec = { ...lastRec, runs: lastRec.runs.slice().reverse() };
    setTimeout(() => hydrateImgs($('#histList')), 0);
    $('#histList').innerHTML = `<div class="card">${runsHtml(rec, run => `<button class="primary" data-show="${esc(run.run_id)}">🖥 結果をモニタに出す</button><button data-reask="${esc(run.run_id)}">🔁 もう一度出題</button>`, nowId)}</div>`;
    $$('[data-show]', $('#histList')).forEach(b => b.onclick = () => showOnMonitor(lastRec.runs.find(r => r.run_id === b.dataset.show)));
    $$('[data-reask]', $('#histList')).forEach(b => b.onclick = () => { const r = lastRec.runs.find(x => x.run_id === b.dataset.reask); if (r) ask(runToQuestion(r)); });
  }
  async function showOnMonitor(run) {
    if (!run) return;
    if (cur().phase === 'open' && !confirm('いま回答受付中のアンケートがあります。締め切って、この結果をモニタに出しますか？')) return;
    const s = run.settings || {};
    if (await push({ phase: 'result', run: { id: run.run_id, question: run.question, options: run.options, duration: s.duration || 0, reveal: s.reveal || 'after', showCount: s.showCount !== false, phoneResult: s.phoneResult !== false, ...imgFieldsOf(s), replay: true }, rk: uid(6) })) toast('モニタに結果を出しました');
  }
  function histTick() {
    const st = cur();
    if (st.rev !== histRev) { histRev = st.rev; clearTimeout(histT); histT = setTimeout(refreshHistory, 700); }
    else if (!$('#tabHist').hidden && st.phase === 'open' && Date.now() - (histTick.t || 0) > 3000) { histTick.t = Date.now(); refreshHistory(); }
  }
  setInterval(() => { if (w.room) histTick(); }, 1000);
  $('#histReload').onclick = refreshHistory;
  $('#histSave').onclick = () => $('#btnSave').click();

  /* --- サッと出題 --- */
  const quick = qForm('qk', $('#quick'));
  $('#qkGo').onclick = () => ask(quick.read());

  /* --- 質問バンク（部屋ごと・サーバー保存） --- */
  let myQrev = null, qSaveT = null, qSaving = false, qDirty = false;
  bankSaver = () => { qDirty = true; clearTimeout(qSaveT); qSaveT = setTimeout(flushQuestions, 300); };
  async function flushQuestions() {
    if (qSaving) { qSaveT = setTimeout(flushQuestions, 300); return; }
    qSaving = true; qDirty = false;
    const res = await API.setQuestions(code, secret, ROOM_BANK);
    qSaving = false;
    if (res.ok) myQrev = res.qrev; else toast('質問を保存できませんでした：' + errMsg(res.error), 4000);
  }
  async function pullQuestions() {
    const res = await API.getQuestions(code, secret);
    if (!res.ok || qDirty || qSaving) return;
    ROOM_BANK = cleanQuestions(res.questions, true); myQrev = res.qrev; renderBanks();
  }
  function syncQuestions() { if (w.room && myQrev !== null && w.room.qrev !== myQrev && !qDirty && !qSaving) { myQrev = w.room.qrev; pullQuestions(); } }
  setInterval(syncQuestions, 1000);
  pullQuestions();
  function legacyHtml() {
    const legacy = store.get(LEGACY_BANK_KEY, []);
    if (!Array.isArray(legacy) || !legacy.length) return '';
    return `<div class="legacy">💡 前のバージョンで、このPCに保存した質問が <b>${legacy.length}問</b> あります。<div class="row" style="margin-top:6px"><button id="lgImp">この部屋に取りこむ</button><button id="lgDel" class="danger">消す</button></div></div>`;
  }
  /* --- 質問バンク --- */
  function renderBankRun() {
    const bank = loadBank(); $('#bankN').textContent = bank.length ? `（${bank.length}問）` : '';
    $('#bankRun').innerHTML = bank.length ? bank.map(q => `<div class="qitem"><div class="qt"><b>${esc(q.text || '（質問文なし）')}</b><div class="chips">${used.has(q.id) ? '<span class="chip used">✓ 出題ずみ</span>' : ''}${qChips(q)}</div></div><div class="acts"><button class="primary" data-ask="${q.id}">出題</button></div></div>`).join('')
      : '<p class="muted" style="margin:0">まだありません。「✏️ 質問をつくる」タブで用意できます。</p>';
    $$('[data-ask]', $('#bankRun')).forEach(b => b.onclick = () => { const q = loadBank().find(x => x.id === b.dataset.ask); if (q) ask(q); });
  }
  const ed = qForm('ed', $('#ed'));
  ed.onImage = async (id, data) => {
    const r = await API.putImage(code, secret, id, data);
    if (!r.ok) { toast('画像を保存できませんでした：' + errMsg(r.error), 4000); return false; }
    return true;
  };
  let editing = null;
  function renderBankEdit() {
    const bank = loadBank();
    $('#bankEdit').innerHTML = bank.length ? bank.map((q, i) => `<div class="qitem"><div class="qt"><b>${i + 1}. ${esc(q.text || '（質問文なし）')}</b><div class="chips">${qChips(q)}</div></div><div class="acts">
      <button data-up="${i}" ${i === 0 ? 'disabled' : ''}>↑</button><button data-dn="${i}" ${i === bank.length - 1 ? 'disabled' : ''}>↓</button><button data-ed="${q.id}">編集</button><button class="danger" data-del="${q.id}">削除</button></div></div>`).join('')
      : '<p class="muted" style="margin:0">まだありません</p>';
    const B = $('#bankEdit');
    $$('[data-ed]', B).forEach(b => b.onclick = () => { const q = loadBank().find(x => x.id === b.dataset.ed); if (!q) return; editing = q.id; ed.write(q); $('#edTitle').textContent = '✏️ 質問を編集中'; $('#edSave').textContent = '上書き保存'; window.scrollTo({ top: 0, behavior: 'smooth' }); });
    $$('[data-del]', B).forEach(b => b.onclick = () => { if (!confirm('この質問を削除しますか？')) return; saveBank(loadBank().filter(x => x.id !== b.dataset.del)); if (editing === b.dataset.del) resetEd(); renderBanks(); });
    const mv = (i, d) => { const bk = loadBank(); const j = i + d; if (j < 0 || j >= bk.length) return; [bk[i], bk[j]] = [bk[j], bk[i]]; saveBank(bk); renderBanks(); };
    $$('[data-up]', B).forEach(b => b.onclick = () => mv(+b.dataset.up, -1));
    $$('[data-dn]', B).forEach(b => b.onclick = () => mv(+b.dataset.dn, 1));
  }
  function renderBanks() {
    renderBankRun(); renderBankEdit();
    $('#legacyBox').innerHTML = legacyHtml();
    const li = $('#lgImp'), ld = $('#lgDel');
    if (li) li.onclick = () => { if (importQuestions(store.get(LEGACY_BANK_KEY, []))) { store.del(LEGACY_BANK_KEY); renderBanks(); } };
    if (ld) ld.onclick = () => { if (confirm('このPCに残っている前のバージョンの質問を消しますか？')) { store.del(LEGACY_BANK_KEY); renderBanks(); } };
  }
  function resetEd() { editing = null; ed.write({ type: 'yesno', count: 4, duration: 30, reveal: 'after', showCount: true }); $('#edTitle').textContent = '✏️ 新しい質問'; $('#edSave').textContent = '保存する'; }
  $('#edSave').onclick = () => {
    const q = ed.read();
    if (!q.text) return toast('質問文を入れてください');
    if (buildOptions(q).length < 2) return toast('ボタンの文字を2つ以上入れてください');
    const bank = loadBank();
    if (editing) { const i = bank.findIndex(x => x.id === editing); if (i >= 0) bank[i] = { ...q, id: editing }; else bank.push({ ...q, id: 'q' + uid(8) }); }
    else bank.push({ ...q, id: 'q' + uid(8) });
    saveBank(bank); toast(editing ? '上書き保存しました' : '保存しました'); resetEd(); renderBanks();
  };
  $('#edNew').onclick = resetEd;
  $('#bankExp').onclick = async () => {
    const bank = loadBank(); if (!bank.length) return toast('書き出す質問がありません');
    const images = await collectImages(idsOfQuestions(bank));
    const d = new Date();
    const nm = ((w.room && w.room.title) || 'アンケート').replace(/[\\/:*?"<>|\s]+/g, '_');
    download(`質問セット_${nm}_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.json`, JSON.stringify({ app: 'minnade-pochi', kind: 'questions', version: 2, title: (w.room && w.room.title) || '', anon_mode: w.room && w.room.anon_mode, questions: bank, images }, null, 2), 'application/json');
  };
  $('#bankImp').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const got = questionsFromFile(JSON.parse(await f.text()));
      if (!got || !got.questions.length) throw 0;
      await putImages(code, secret, got.images);
      if (!importQuestions(got.questions)) throw 0;
      renderBanks();
    } catch { toast('読みこめませんでした（このアプリで書き出したファイルを選んでね）'); }
  };
  resetEd(); renderBanks();

  /* --- 上の帯のボタン --- */
  $('#btnDisp').onclick = () => {
    const win = window.open(dispUrl, 'evapp_disp_' + code, 'popup=yes,width=1280,height=760');
    if (!win) toast('ポップアップがブロックされました。「URL・QR」の表示用URLを使ってください', 4000);
    else toast('開いたウィンドウをモニタ側へ移して、ダブルクリックで全画面に', 4500);
  };
  $('#btnPin').onclick = async () => {
    if (!confirm('カギの数字を作り直しますか？\n（もう入っている人はそのまま。新しく入る人は新しい数字が必要になります）')) return;
    const res = await API.regenPin(code, secret);
    if (!res.ok) return toast(errMsg(res.error));
    toast('新しいカギ：' + res.pin); w.refresh(); API.ping(code);
  };
  $('#btnShare').onclick = () => {
    const q1 = qrDataUrl(joinUrl);
    const m = openModal(`<h2>🔗 URL・QRコード</h2>
      <div class="sharebox">${q1 ? `<img src="${q1}" alt="">` : ''}<div><b>🙋 参加用（観客に見せてOK）</b><div class="u">${esc(joinUrl)}</div>
        <div class="row"><button data-copy="join">コピー</button>${DEMO ? `<a class="btn" href="${esc(joinUrl)}" target="_blank" rel="noopener">新しいタブで参加者として開く</a>` : ''}</div></div></div>
      <div class="sharebox"><div style="font-size:2rem">🖥</div><div><b>表示用（モニタをつないだ別のPCで開く）</b><div class="u">${esc(dispUrl)}</div><button data-copy="disp">コピー</button></div></div>
      <div class="sharebox"><div id="rmQr" style="font-size:2rem">📱</div><div><b>リモコン用（スマホでこの操作画面を開く）</b><div class="u">${esc(remoteUrl)}</div><div class="row"><button data-copy="remote">コピー</button><button id="rmShow">QRを表示</button></div></div></div>
      <p class="warn">⚠ 表示用とリモコン用のURLにはマスターのカギが入っています。観客には見せないでください。${DEMO ? '<br>（おためしモードでは、同じブラウザの中でしか動きません）' : ''}</p>
      <div class="row" style="justify-content:flex-end"><button data-close>閉じる</button></div>`);
    $$('[data-copy]', m).forEach(b => b.onclick = () => copyText({ join: joinUrl, disp: dispUrl, remote: remoteUrl }[b.dataset.copy]));
    $('#rmShow', m).onclick = () => { const q = qrDataUrl(remoteUrl); if (q) $('#rmQr', m).innerHTML = `<img src="${q}" alt="">`; else toast('QRコードを作れませんでした'); };
  };
  $('#btnSave').onclick = () => {
    const m = openModal(`<h2>💾 結果を保存</h2><p>この部屋で出したアンケートの質問・設定・結果を、ぜんぶファイルに保存します。<br><small>部屋と結果はサーバーから24時間で消えます。<b>記録ファイル（JSON）</b>は、あとでトップの「記録を見る」から開けます。</small></p>
      <div class="row"><button class="primary" id="sJson">記録ファイル（JSON）</button><button id="sCsv">CSV（エクセル用）</button><button data-close>閉じる</button></div>`);
    const get = async () => {
      const res = await API.exportAll(code, secret); if (!res.ok) { toast(errMsg(res.error)); return null; }
      const rec = makeRecord(res, code); lastRec = rec; if (backupOn()) saveBackup(rec);
      if (!rec.runs.length) { toast('まだ結果がありません'); return null; }
      rec.images = await collectImages(idsOfRecord(rec)); return rec;
    };
    $('#sJson', m).onclick = async () => { const r = await get(); if (r) { download(recName(r, 'json'), JSON.stringify(r, null, 2), 'application/json'); m.remove(); } };
    $('#sCsv', m).onclick = async () => { const r = await get(); if (r) { download(recName(r, 'csv'), recordCsv(r), 'text/csv'); m.remove(); } };
  };
  $('#btnEnd').onclick = async () => {
    if (backupOn()) await refreshHistory();
    if (!confirm('部屋を終了しますか？\n参加者は入れなくなり、サーバーの結果も消えます。\n' + (backupOn() && lastRec && lastRec.runs.length ? '（このPCのブラウザには控えが残ります）' : '（先に「結果を保存」しておくと安心です）'))) return;
    const res = await API.closeRoom(code, secret);
    if (!res.ok) return toast(errMsg(res.error));
    API.ping(code); dropMyRoom(code); location.href = pageUrl();
  };

  /* --- テスト用ダミー参加者 --- */
  const BOTS_KEY = 'evapp_bots_' + code;
  const bots = store.get(BOTS_KEY, []);
  const botCount = () => { $('#botN').textContent = bots.length ? `（いま${bots.length}人）` : ''; };
  botCount();
  const NAMES = ['たろう', 'はなこ', 'けんじ', 'さくら', 'ゆうき', 'みどり', 'ひろし', 'あおい', 'そうた', 'ももこ', 'だいち', 'りん', 'かずき', 'なな', 'しょう', 'えみ', 'りく', 'ほのか', 'こうへい', 'ちひろ'];
  async function addBots(n) {
    if (!w.room) return;
    for (let i = 0; i < n; i++) {
      const d = 'bot-' + uid(10);
      const res = await API.join(code, w.room.pin, d, 'ダミー' + NAMES[Math.floor(Math.random() * NAMES.length)]);
      if (res.ok) bots.push({ d, vt: 'vtbot-' + uid(12) });
    }
    store.set(BOTS_KEY, bots); botCount();
    w.refresh(); toast(`ダミー${n}人が参加しました`);
  }
  function runBots(st) {
    if (!bots.length || !$('#botAuto') || !$('#botAuto').checked) return;
    const n = st.run.options.length, wts = Array.from({ length: n }, () => Math.random() + 0.25), sum = wts.reduce((a, b) => a + b, 0);
    const pick = () => { let x = Math.random() * sum; for (let i = 0; i < n; i++) { x -= wts[i]; if (x <= 0) return i; } return n - 1; };
    const span = st.ends_at ? Math.max(1200, st.ends_at - Clock.now() - 1000) : 9000;
    bots.forEach(b => {
      if (Math.random() < 0.08) return;
      setTimeout(() => {
        API.vote(code, b.d, b.vt, st.run.id, pick());
        if (Math.random() < 0.12) setTimeout(() => API.vote(code, b.d, b.vt, st.run.id, Math.floor(Math.random() * n)), 1500);
      }, Math.random() * span * 0.85);
    });
  }
  $('#bot10').onclick = () => addBots(10); $('#bot30').onclick = () => addBots(30);
  $('#botKick').onclick = async () => {
    if (!confirm('ダミーを全員帰らせますか？（ダミーの投票も消えます）')) return;
    const res = await API.removeBots(code, secret);
    if (!res.ok) return toast(errMsg(res.error));
    bots.length = 0; store.del(BOTS_KEY); botCount();
    w.refresh(); w.refreshResults(); API.ping(code); if (!$('#tabHist').hidden) refreshHistory();
    toast(`ダミー${res.removed}人が帰りました`);
  };
}

/* =========================================================
   はじまり
   ========================================================= */
(async function main() {
  try { API = DEMO ? makeLocalServer() : await makeSupaServer(); }
  catch (e) { $('#app').innerHTML = msgPage('📡', 'サーバーにつながりません', '電波を確認して、ページを読みこみ直してください。', false); return; }
  loadScript(QR_SRC).then(() => { qrReady = true; document.dispatchEvent(new Event('qrready')); }).catch(() => {});
  const r = Q.get('r'), op = Q.get('op'), disp = Q.get('disp');
  if (r) participantView(r.toUpperCase());
  else if (op) operatorView(op.toUpperCase());
  else if (disp) displayView(disp.toUpperCase());
  else landingView();
})();
</script>
</body>
</html>
