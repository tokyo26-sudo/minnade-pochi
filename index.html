<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<title>みんなでポチッ v0.14.3</title>
<style>
:root{
  --ink:#1d2433;--sub:#5b6478;--line:#e3e6ee;--bg:#f4f5f9;--card:#fff;
  --brand:#ff5a36;--brand-soft:#fff3ef;--ok:#2e9e65;--ng:#e5484d;--r:14px;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55em 1em;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{border-color:#c9cedb}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--ng);border-color:#f3c4c5}
button.big{font-size:1.1rem;padding:.8em 1.4em}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{border:1px solid #cfd4e0;border-radius:10px;padding:.55em .7em;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
small,.muted{color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.card h3{margin:0 0 12px;font-size:1.02rem;display:flex;align-items:center;gap:.4em}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:.78rem;color:var(--sub);margin-bottom:4px;font-weight:700}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.92rem;cursor:pointer}
.chk input{width:auto;margin:0;accent-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.72rem;background:#eef0f6;border-radius:99px;padding:.15em .65em;color:var(--sub);font-weight:600}
.chip.used{background:#e3f5ea;color:#1f7a4a}
.btnprev{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.bp{background:var(--c);color:#fff;border-radius:8px;padding:.25em .8em;font-weight:800;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#1d2433;color:#fff;padding:.7em 1.2em;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>div{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 14px;font-size:1.2rem}
.warn{background:#fff4d6;border:1px solid #f5d27a;border-radius:10px;padding:8px 12px;font-size:.85rem}
.msgpage{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
.msgpage .mp-icon{font-size:3.4rem}
.msgpage h2{margin:.3em 0}
.msgpage p{color:var(--sub)}
@keyframes pulse{from{opacity:1}to{opacity:.45}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- トップ ---------- */
.land{max-width:720px;margin:0 auto;padding:36px 16px 60px}
.logo{font-size:2.2rem;font-weight:900;letter-spacing:.02em;line-height:1.2}
.logo span{color:var(--brand)}
.lead{color:var(--sub);margin:.4em 0 20px}
.demo-banner{background:#fff4d6;border:1px solid #f5d27a;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.modes{display:grid;gap:8px}
.more summary{cursor:pointer;font-weight:800;list-style:none;color:var(--sub)}
.more summary::-webkit-details-marker{display:none}
.more summary small{font-weight:600}
.more[open] summary{margin-bottom:6px}
.more-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.more-sec h3{margin:0 0 8px;font-size:1rem}
.mode{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.mode input{width:auto;margin-top:5px;accent-color:var(--brand)}
.mode:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.qitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.qitem .qt{flex:1;min-width:0}
.qitem .qt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.qitem .acts button{padding:.35em .7em;font-size:.85rem}

/* ---------- 参加者（スマホ） ---------- */
body.v-part{background:#fff7ee}
.p-wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.p-title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.p-mode{margin-top:8px;font-size:.76rem;background:#fff;border:1px solid #f0dcc4;border-radius:10px;padding:6px 10px;color:#6b4e2e}
.p-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.p-q{font-size:1.35rem;font-weight:800;line-height:1.45;text-align:center;margin-bottom:14px;word-break:break-word;animation:pop .3s ease}
.p-timer{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.p-timer .bar{flex:1;height:10px;background:#f1e2cf;border-radius:99px;overflow:hidden}
.p-timer .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff5a36);border-radius:99px;transition:width .25s linear}
.p-timer span{font-weight:900;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.p-timer.hurry span{color:var(--ng);animation:pulse .5s infinite alternate}
.p-timer.nolimit .bar{display:none}
.p-opts{display:grid;gap:12px}
.p-opts.n4,.p-opts.n5,.p-opts.n6{grid-template-columns:1fr 1fr}
.opt{position:relative;border:none;border-radius:18px;background:var(--c);color:#fff;font-size:1.45rem;font-weight:900;min-height:88px;padding:14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,opacity .2s;white-space:normal;word-break:break-word;line-height:1.25}
.p-opts.n2 .opt{min-height:min(25vh,190px);font-size:2rem}
.p-opts.n3 .opt{min-height:min(16vh,120px);font-size:1.7rem}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.p-opts.has .opt:not(.sel){opacity:.35}
.opt.sel{outline:5px solid #1d2433;outline-offset:3px}
.opt.sel::after{content:"✓";position:absolute;top:6px;right:12px;font-size:1.2rem}
.p-note{text-align:center;margin-top:18px;font-weight:700;color:var(--sub);min-height:1.5em}
.p-note.done{color:var(--ok)}
.p-center{text-align:center}
.p-center .big{font-size:3.6rem;line-height:1.2}
.p-center h2{margin:.3em 0 .2em;font-size:1.4rem}
.p-center p{color:var(--sub);margin:.3em 0}
.p-answer{display:inline-block;margin-top:14px;background:var(--c,#999);color:#fff;font-weight:900;font-size:1.3rem;border-radius:12px;padding:.4em 1em}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin:0 4px;animation:pulse .7s infinite alternate}
.dots i:nth-child(2){animation-delay:.23s}.dots i:nth-child(3){animation-delay:.46s}
.p-join .card{margin-top:16px}
.p-join .pin{font-size:1.8rem;letter-spacing:.4em;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.p-err{color:var(--ng);font-weight:700;min-height:1.4em;margin:-4px 0 8px;font-size:.9rem}
.p-off{position:fixed;top:0;left:0;right:0;background:#e5484d;color:#fff;text-align:center;font-size:.8rem;padding:3px;display:none;z-index:9}
.p-off.show{display:block}

/* ---------- ステージ（モニタ表示） ---------- */
body.v-disp{background:#0b1026;overflow:hidden}
body.v-disp #app{position:fixed;inset:0}
body.v-disp.idle{cursor:none}
.stage{container-type:size;position:relative;width:100%;height:100%;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#22306e 0%,#0b1026 62%)}
.st{position:absolute;inset:0;display:flex;flex-direction:column;padding:4cqh 4cqw}
.st-title{font-size:4.4cqh;font-weight:800;opacity:.85;text-align:center}
.st-q{font-size:min(5.6cqw,9.5cqh);font-weight:900;line-height:1.25;text-align:center;margin:0 0 2.5cqh;word-break:break-word}
.st-q.small{font-size:min(3.6cqw,6.2cqh);opacity:.9}
.st-foot{display:flex;justify-content:space-between;align-items:center;font-size:3.4cqh;margin-top:2.4cqh;gap:2cqw}
.st-foot b{font-size:1.25em;font-variant-numeric:tabular-nums}
.st-mode{opacity:.65;font-size:.85em}
.st-join{flex:1;display:flex;align-items:center;justify-content:center;gap:5cqw;min-height:0}
.st-qr{background:#fff;padding:2cqh;border-radius:2.6cqh;height:min(60cqh,40cqw);aspect-ratio:1;flex:none}
.st-qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.st-lead{font-size:5cqh;font-weight:800;margin-bottom:3cqh;line-height:1.3}
.st-pinlabel{font-size:3.2cqh;opacity:.7}
.st-pin{font-size:min(17cqh,12cqw);font-weight:900;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:#ffd54a;line-height:1.05}
.st-pinhide{font-size:min(7cqh,5cqw);font-weight:900;color:#ffd54a;line-height:1.3;margin-top:.6cqh}
.st-wjoin .st-pinhide{font-size:min(5cqh,3.6cqw)}
.st-url{font-size:2.5cqh;opacity:.6;margin-top:2.4cqh;word-break:break-all;max-width:46cqw}
.st-demo{margin-top:2cqh;font-size:2.4cqh;background:#ffb020;color:#1d2433;border-radius:1cqh;padding:.6cqh 1.2cqh;font-weight:800;max-width:46cqw}
.st-count{font-size:5.4cqh;font-weight:900}
.st-timer{display:flex;align-items:center;gap:2cqw;margin-bottom:3cqh}
.st-bar{flex:1;height:2.4cqh;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden}
.st-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd54a,#ff7a45);border-radius:99px;transition:width .25s linear}
.st-sec{font-size:8cqh;font-weight:900;min-width:13cqw;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.st-sec small{font-size:.45em;margin-left:.15em}
.st-timer.hurry .st-sec{color:#ff6b6b;animation:pulse .5s infinite alternate}
.st-timer.nolimit .st-bar{visibility:hidden}
.st-timer.over .st-sec{font-size:6cqh;color:#ffd54a}
.tiles{flex:1;display:grid;gap:2.4cqh 2cqw;grid-template-columns:repeat(var(--cols),1fr);align-content:center;min-height:0}
.tile{background:var(--c);border-radius:2.4cqh;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:min(5.4cqw,9cqh);padding:2cqh 1.5cqw;min-height:18cqh;text-align:center;word-break:break-word;line-height:1.2;box-shadow:0 1cqh 0 rgba(0,0,0,.28)}
.cols{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2.2cqw;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col-top{text-align:center;font-weight:900;font-size:min(7.5cqw,11cqh);line-height:1;font-variant-numeric:tabular-nums}
.col-top small{font-size:.42em;margin-left:.08em}
.col-pct{font-size:3.2cqh;opacity:.75;text-align:center;margin:.6cqh 0 1cqh;font-variant-numeric:tabular-nums}
.col-track{flex:1;position:relative;background:rgba(255,255,255,.07);border-radius:1.6cqh 1.6cqh 0 0;min-height:3cqh}
.col-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);border-radius:1.6cqh 1.6cqh 0 0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.col-label{background:var(--c);text-align:center;font-weight:900;font-size:min(3.8cqw,6cqh);padding:1.2cqh .6cqw;border-radius:1.6cqh;margin-top:1.4cqh;word-break:break-word;line-height:1.15}
.col-track{border-bottom:.5cqh solid rgba(255,255,255,.35)}
.col.win .col-top{color:#ffd54a}
.col-top{position:relative;padding-top:.62em}
.col.win .col-top::before{content:"👑";position:absolute;top:0;left:0;right:0;font-size:.42em;line-height:1.2}
.col.win .col-fill{box-shadow:0 0 3cqh rgba(255,213,74,.55)}
.col-names{font-size:2cqh;opacity:.85;margin-top:1cqh;line-height:1.35;height:8.4cqh;overflow:hidden;text-align:center;word-break:break-all}
.st-big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;text-align:center}
.st-big b{font-size:min(15cqh,11cqw);font-weight:900;color:#ffd54a;line-height:1.1;animation:pop .35s ease}
.st-big span{font-size:4.6cqh;opacity:.85}
.st-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;transition:opacity .6s;z-index:5}

/* ---------- マスター（操作） ---------- */
body.v-op{background:#eef0f5}
.op-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px}
.op-brand{font-weight:900;font-size:1.05rem}
.op-brand span{color:var(--brand)}
.demo-tag{background:#ffb020;color:#fff;font-size:.7rem;border-radius:6px;padding:.15em .5em;margin-left:.4em;vertical-align:middle}
.op-room{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;flex:1}
.op-kv{display:flex;align-items:baseline;gap:6px}
.op-kv label{font-size:.72rem;color:var(--sub);font-weight:700}
.op-kv b{font-size:1.1rem}
#hPin{letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--brand)}
.mini{padding:.15em .5em!important;font-size:.8rem!important;border-radius:7px!important}
.op-actions{display:flex;gap:8px;flex-wrap:wrap}
.op-tabs{display:flex;gap:4px;padding:12px 18px 0;max-width:1400px;margin:0 auto}
.op-tabs button{border-radius:10px 10px 0 0;border-color:transparent;background:#dfe2ea;color:var(--sub)}
.op-tabs button.on{background:#fff;color:var(--ink)}
.op-body{max-width:1400px;margin:0 auto;padding:0 18px 40px}
.op-run{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;align-items:start}
.op-run .card:first-child{border-top-left-radius:0}
.op-edit{display:grid;grid-template-columns:minmax(320px,500px) 1fr;gap:16px;align-items:start}
.op-edit .card:first-child{border-top-left-radius:0}
.lbls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phase{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:900}
.phase .dot{width:14px;height:14px;border-radius:50%;background:#9aa2b5;flex:none}
.phase.open .dot{background:var(--ng);animation:pulse .7s infinite alternate}
.phase.closed .dot{background:#ffb020}
.phase.result .dot{background:var(--ok)}
.op-q{margin:6px 0 0;font-weight:700;word-break:break-word}
.op-timer{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.op-timer.hurry{color:var(--ng)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toggles button{font-size:.85rem;padding:.4em .8em}
.toggles button.on{background:#1d2433;color:#fff;border-color:#1d2433}
.preview{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1026;position:relative}
.ores-q{font-weight:800;margin-bottom:6px}
.ores-row{display:grid;grid-template-columns:minmax(4em,auto) 1fr auto;gap:10px;align-items:center;margin:7px 0}
.ores-lab{font-weight:800;padding:.15em .6em;border-radius:7px;color:#fff;background:var(--c);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ores-bar{height:14px;background:#eef0f6;border-radius:99px;overflow:hidden}
.ores-bar i{display:block;height:100%;background:var(--c);transition:width .4s}
.ores-n{font-weight:900;font-variant-numeric:tabular-nums;min-width:5.2em;text-align:right}
.ores-names{grid-column:1/-1;font-size:.8rem;color:var(--sub);margin:-4px 0 2px;word-break:break-all}
.ores-tot{margin-top:8px;font-weight:700}
.sharebox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sharebox img{width:132px;height:132px;image-rendering:pixelated;border:6px solid #fff;outline:1px solid var(--line);border-radius:6px}
.sharebox .u{font-size:.8rem;word-break:break-all;background:#f4f5f9;border-radius:8px;padding:6px 8px;margin:6px 0}
.op-hist{max-width:980px}
.help{font-size:.92rem;line-height:1.7}
.help h2{margin:0 0 6px}
.help h3{font-size:1.02rem;margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.help h4{font-size:.95rem;margin:12px 0 2px}
.help ul,.help ol{margin:4px 0 6px;padding-left:1.4em}
.help p{margin:4px 0}
.help .note{font-size:.84rem;color:var(--sub)}
.help .credit{font-size:.78rem;color:var(--sub);margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
.modal>div.wide{max-width:780px}
.helpbtn{position:absolute;top:36px;right:16px}
.land{position:relative}
.p-help{text-align:center;margin:14px 0 0;font-size:.88rem}
.p-help a{color:var(--sub);font-weight:700}
.sfx-lock{position:fixed;left:16px;bottom:16px;z-index:6;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
@keyframes drum{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-8deg) scale(1)}}
.st-big b.drum{animation:drum .18s infinite;color:#fff}
.vol{display:flex;align-items:center;gap:10px;margin:-4px 0 12px 28px}
.vol input{flex:1;accent-color:var(--brand)}
img[data-img]:not([src]){visibility:hidden}
/* stage images */
.st-qrow{display:flex;gap:2.6cqw;align-items:center;margin:0 0 2.2cqh}
.st-qrow .st-q{flex:1;text-align:left;margin:0}
.st-qimg{height:24cqh;width:40cqh;flex:none;border-radius:1.6cqh;overflow:hidden;background:rgba(255,255,255,.08)}
.st-qimg.big{height:44cqh;width:72cqh}
.st-qimg.sm{height:17cqh;width:28cqh}
.cl-img .noimg{display:flex;height:100%;align-items:center;justify-content:center;color:var(--c);font-weight:900}
.st-qimg img{width:100%;height:100%;object-fit:contain;display:block}
.tiles.img{align-content:stretch;grid-auto-rows:1fr}
.tile.timg{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;padding:1.1cqh;min-height:0}
.tile.timg b{font-size:min(2.9cqw,4.8cqh);padding:.7cqh .5cqw .2cqh;line-height:1.15}
.ti{flex:1;min-height:0;border-radius:1.4cqh;overflow:hidden;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center}
.ti img{width:100%;height:100%;object-fit:contain;display:block}
.fit-cover img{object-fit:cover!important}

  <h4>1. 部屋をつくる</h4>
  <p>トップで部屋の名前を入れて、「部屋をつくる」を押します。名前のあつかいは、質問ごとに選べます（さいしょは 👤 匿名）。</p>
  <ul>
    <li>🔒 完全匿名：だれが何を答えたか、マスターにもわかりません</li>
    <li>👤 匿名：名前はマスターだけが見られます</li>
    <li>📢 記名：答えた人の名前がモニタに出ます</li>
  </ul>
  <p class="note">※名前のあつかいは<b>質問ごと</b>に選べます（部屋の設定は、新しい質問の最初の値）。参加者のスマホには、質問の上に毎回表示されます。出題したあとは、その質問のあつかいは変えられません。部屋の名前は、操作画面の上の ✏️ であとから変えられます。<br>※「このPCで覚える」に印を付けると、次からパスワードの入力がいりません（共用PCでは外してください）。</p>
  <h4>2. モニタに映す</h4>
  <p>PCとモニタを「拡張」でつなぎ（Windows：Win＋P → 拡張／Mac：ミラーリングをオフ）、「🖥 表示用ウィンドウを開く」を押します。開いたウィンドウをモニタ側へ動かし、ダブルクリック（またはFキー）で全画面にします。</p>
  <p class="note">🔊 効果音を鳴らすには、表示用ウィンドウを一度クリックしてください（ブラウザの決まりで、さわるまで音が出せません）。左下に「音をオンにする」が出ているときは、まだ音が出ない状態です。</p>
  <h4>3. 参加してもらう</h4>
  <p>モニタに出ているQRコードをスマホで読み、名前とカギの数字（4ケタ）を入れると参加できます。途中からの参加もOKです。</p>
  <p class="note">🔑 オンライン配信もしていて、会場の人だけに参加してほしいとき → 操作画面の上の「🖥 モニタに表示中」を押して「🙈 モニタではかくし中」にすると、モニタにはQRコードだけが出ます。カギの数字は会場で口頭で伝えてください（QRコードには数字は入っていません）。</p>
  <h3>アンケートを出す</h3>
  <ul>
    <li><b>⚡ サッと出題</b>：その場で質問文とボタンを決めて、すぐ出せます</li>
    <li><b>📋 この部屋の質問</b>：用意しておいた質問を、好きな順番で出せます</li>
    <li>制限時間がくると自動で締め切ります。「⏹ 締め切る」で途中でも締め切れます</li>
    <li>「あとで発表」の質問は、「🎉 結果発表！」を押すとドラムロールのあとモニタに結果が出ます。「ロールなしで発表」に印を付けると、すぐ出ます</li>
    <li>「📱 スマホに結果」をオンにすると、参加者のスマホにもグラフが出ます（名前は出ません）</li>
  </ul>
  <h3>✍️ 自由に書く（感想・大喜利など）</h3>
  <p>ボタンの種類で「✍️ 自由に書く」を選ぶと、参加者のスマホに入力らんが出ます（${TEXT_MAX}文字まで・1人1件・締め切りまでは書き直しOK）。</p>
  <ul>
    <li>受付中、モニタには質問と「📮 とどいた○件」だけが出ます。中身はマスターにだけ見えます</li>
    <li>操作画面の「📮 とどいた文章」に、きた順でならびます。面白いものの「🖥 モニタに出す」を押すと、モニタに大きく出ます</li>
    <li>「▶ 次の文章」で、まだ出していないものを順番に出せます。「表示を消す」で一覧の画面にもどります</li>
    <li>モニタに出た人のスマホには「あなたのコメントがモニタに出ました！」と出ます</li>
    <li>名前：「自由に書く」を選ぶと、名前のあつかいは 📢 記名 になります（変えられます）。📢 記名 → モニタにも名前が出ます／👤 匿名 → マスターだけ見えます／🔒 完全匿名 → だれにもわかりません</li>
    <li>🙈 記名・匿名の質問では、参加者がスマホで「匿名で送る」に印を付けられます。その文章は、モニタにもマスターにも名前が出ません（質問をつくるときに、選べないようにもできます）</li>
    <li>休憩中に集めて、あとで読むこともできます：休憩前に出題（制限時間は「制限なし」がおすすめ）→ 休憩が終わったら「⏹ 締め切る」→ ほかのアンケートを進める → 最後に「📜 履歴」タブで、その質問の「▼ 文章を見る」をひらいて「🖥 モニタに出す」</li>
    <li>大喜利は、質問に「お題の画像」を付けると、モニタで答えといっしょに出ます</li>
    <li>受付中のモニタには、参加用のQRコードとカギの数字も出ます（途中からでも参加できます）</li>
    <li><b>🧱 ぜんぶタイルで出す</b>：とどいた文章を来た順にポポポンとならべます（記名の質問なら名前も）。多いときは操作画面の「▲ 上へ／▼ 下へ」、または表示用ウィンドウの上でマウスホイール・↑↓キーで動かします</li>
  </ul>
  <h3>🔴 早押し</h3>
  <ul>
    <li>進行タブの「🔴 早押しをはじめる」を押すと、参加者のスマホに大きな丸いボタンが出ます（早押しはいつも記名です）</li>
    <li>押した順に、モニタに上位5人の名前が出ます（2位からは1位との差の秒数も）。操作画面には全員の順番が出ます</li>
    <li>だれかが押すたびに、早押しボタンの音が鳴ります（鳴っているあいだに押された分は鳴らしません）</li>
    <li>順番は、サーバーに届いた順で決まります。1つの問題で数えるのは、1人1回目だけです</li>
    <li>「🎵 デデン！（次の問題）」で、押した人を消してデデン！の音。第◯問が1つ進むのは、<b>「⭕ ピンポン」か「❌ ブー」を鳴らしたあと</b>のデデン！だけ（さいしょの1回は第1問）</li><li>ピンポンもブーも鳴らしていないのにデデン！→ だれか押していたら「押した人を消して、やりなおしますか？」と聞きます（番号はそのまま）。だれも押していなければ音だけ</li><li>だれも押さなかった（スルー）ときは、ブーを鳴らしてからデデン！か、「第◯問を直す」の ＋ で</li><li>「第◯問を直す」の −／＋ で番号を手で直せます。「↺ リセット」は押した人を消すだけ（番号はそのまま）。⚙️ 設定で、第◯問をモニタ・スマホに出さないようにもできます</li>
    <li>パワポなどをモニタに映しながら、スマホだけで早押しを進めることもできます（表示用ウィンドウは閉じていてOK。音はスマホから鳴ります）</li>
    <li>早押しをはじめたときは問題番号なし＝スイッチチェック。「ためしに押してみて〜」→ デデン！で第1問へ（スイッチチェックの記録は「スイッチチェック」として残ります）</li>
    <li>早押しの記録は「📜 履歴」と記録ファイルにも残ります</li>
  </ul>
  <h3>❓ 質問文をかくす（答えから質問を当てるゲームなど）</h3>
  <ul>
    <li>ふだんは質問文が出ます。質問をつくるときに「モニタに質問文を出さない」に印を付けると（サッと出題では、出題すると印は自動ではずれます）、モニタには「❓ 何の質問でしょう？」と出ます（参加者のスマホには質問が出ます）</li>
    <li>操作画面の「🎉 質問を発表！」で、モニタに質問文を出します（ジャン！と鳴ります）。とちゅうで「❓ モニタの質問文をかくす」にもできます</li>
    <li>例：壇上の人が目隠しをしているあいだに「免許をとった年齢は？」を自由に書くで集める → タイルで出して → 何の数字か当ててもらう</li>
  </ul>
  <h3>効果音</h3>
  <ul>
    <li>出題 → ピンポン／制限時間のあいだ → タイマー（残り10秒で速くなる）／時間ゼロ・締め切り → ゴング／結果発表 → ドラムロール → ジャン！</li>
    <li>「投票中も見せる」の質問は、締め切りのゴングだけ鳴ります</li>
    <li><b>鳴る場所</b>：表示用ウィンドウが開いていればそこから。開いていなければ、<b>さいごにさわった操作画面</b>（PC・リモコンのスマホ）から鳴ります。いまどこで鳴るかは、操作画面のいちばん上に出ます</li>
    <li>PCとスマホの両方で操作するときに、片方では鳴らしたくない → その機械の ⚙️ 設定で「この画面では鳴らさない」</li>
    <li>⚙️ 設定で、効果音のオン・オフ・音量・音ごとの大きさ（▼ 細かい調整）を変えられます。この設定は部屋ごとで、表示用ウィンドウ・PC・スマホで共通です</li>
    <li>iPhone はマナーモードだと音が出ないことがあります。スマホから鳴らすときは、マナーモードを切ってください</li>
  </ul>
  <h3>質問を前もって用意する</h3>
  <p>「✏️ 質問をつくる」タブで質問を作れます。</p>
  <ul>
    <li>ボタンの文字は「はい／いいえ」「A・B・C…」のほか、自由に決められます（最大6択）</li>
    <li>🖼 質問や選択肢に画像を付けられます。画像は自動で軽くなります</li>
    <li>「📤 ファイルに書き出す」で質問セットを保存できます</li>
  </ul>
  <h4>前日に準備して、当日使うには</h4>
  <p>前日：練習用の部屋で質問を作り、ファイルに書き出す<br>当日：トップの「▼ そのほか」→「📂 質問セットのファイルから部屋をつくる」でファイルを選んでから、部屋をつくる<br>→ 部屋の名前・名前のあつかい・質問（画像も）が入った部屋ができます</p>
  <p class="note">※部屋は24時間で消えるので、当日につくるのがおすすめです。</p>
  <h3>スマホをリモコンにする</h3>
  <p>「🔗 URL・QR」の「リモコン用」のQRをスマホで読むと、スマホで操作できます。モニタ側のPCでは「表示用」のURLを開いておきます。</p>
  <p class="note">⚠ 表示用・リモコン用のURLは、観客に見せないでください。</p>
  <h3>記録を残す</h3>
  <ul>
    <li>「📜 履歴」タブで、出した質問と結果をふり返れます。「🖥 結果をモニタに出す」で、さっきの結果をもう一度映せます</li>
    <li>「💾 結果を保存」で、記録ファイル（JSON）やCSVをダウンロードできます</li>
    <li>記録ファイルは、トップの「▼ そのほか」→「📂 記録を見る」で、あとからいつでも開けます</li>
    <li>部屋と結果は <b>24時間で自動的に消えます</b>。「部屋を終了」を押すと、その場で消えます。残したいときは、先に保存してください</li>
  </ul>
  <h3>こまったとき</h3>
  <ul>
    <li><b>知らない人がまぎれこんだ</b> → 上の「↻ 作り直す」でカギの数字を変えます（新しく入る人だけに効きます）</li>
    <li><b>参加できない</b> → カギの数字が合っているか、電波があるかを確認してください</li>
    <li><b>画面が変わらない</b> → ページを再読みこみしてください</li>
    <li><b>音が出ない</b> → 操作画面のいちばん上で、どこで鳴る設定かを確認。表示用ウィンドウなら一度クリック、操作画面ならどこかをタップ。⚙️ 設定で効果音がオンか、PC・スマホの音量（マナーモード）も確認してください</li>
    <li><b>パスワードがちがうと言われる</b> → ⚙️ 設定、またはトップで保存したパスワードを忘れさせて、入れ直してください</li>
  </ul>

/* =========================================================
   サーバーとのやりとり
   おためし版（このブラウザの中だけ）と Supabase 版で同じ形にしてある
   ========================================================= */
function makeLocalServer() {
  const KEY = 'evapp_demo_db_v1';
  const load = () => { const db = store.get(KEY, { rooms: {} }); const now = Date.now(); for (const c in db.rooms) if (now - db.rooms[c].created_at > DAY) delete db.rooms[c]; return db; };
  const save = db => store.set(KEY, db);
  const room = (db, code) => db.rooms[String(code || '').toUpperCase()];
  const auth = (db, code, secret) => { const r = room(db, code); return r && r.secret === secret ? r : null; };
  const ok = o => ({ ok: true, server_now: Date.now(), ...o });
  const ng = e => ({ ok: false, error: e, server_now: Date.now() });
  const newPin = () => String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  const isTxt = run => !!run && (run.settings || {}).type === 'text';
  function textList(r, runId, withNames) {
    withNames = withNames && runAnon((r.runs[runId] || {}).settings, r.anon_mode) !== 'full';
    return Object.entries((r.texts || {})[runId] || {}).sort((a, b) => a[1].t - b[1].t)
      .map(([k, v]) => ({ eid: v.eid, body: v.body, name: withNames && r.participants[k] ? r.participants[k].name : null, anon: !r.participants[k], at: v.t, edited: v.u > v.t + 1000 }));
  }
  function tally(r, runId, withNames) {
    const run = r.runs[runId]; if (!run) return null;
    if (isTxt(run)) return { counts: [], total: Object.keys((r.texts || {})[runId] || {}).length, names: null };
    withNames = withNames && runAnon(run.settings, r.anon_mode) !== 'full';
    const n = run.options.length, counts = Array(n).fill(0), names = withNames ? Array.from({ length: n }, () => []) : null;
    const entries = Object.entries(r.votes[runId] || {}).sort((a, b) => a[1].t - b[1].t);
    for (const [k, v] of entries) { counts[v.c]++; if (names) { const p = r.participants[k]; if (p) names[v.c].push(p.name); } }
    return { counts, total: entries.length, names };
  }
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('evapp-demo') : null;
  const subs = new Map(), bzSubs = new Map(), sxSubs = new Map();
  if (bc) bc.onmessage = e => { const d = e.data || {}; const m = (d.bz ? bzSubs : d.sx ? sxSubs : subs).get(d.code); if (m) m.forEach(f => f()); };
  return {
    demo: true,
    async createRoom({ title, anon }) {
      const db = load(); let code; do { code = uid(6).toUpperCase(); } while (db.rooms[code]);
      const r = { code, pin: newPin(), secret: uid(24), title: (title || '').slice(0, 60), anon_mode: anon, state: { phase: 'waiting', rev: 1 }, created_at: Date.now(), participants: {}, runs: {}, votes: {}, questions: [], qrev: 0 };
      db.rooms[code] = r; save(db); return ok({ code, pin: r.pin, secret: r.secret });
    },
    async opState(code, secret) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      return ok({ room: { code: r.code, pin: r.pin, title: r.title, anon_mode: r.anon_mode, state: r.state, created_at: r.created_at, qrev: r.qrev || 0,
        sfx: { disp_at: r.disp_at || 0, ops: r.ops || {}, cfg: r.sfx_cfg || {}, ev: r.sfx_ev || {} } }, participants: Object.keys(r.participants).length });
    },
    async dispBeat(code, secret) { const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room'); r.disp_at = Date.now(); save(db); return ok({}); },
    async opBeat(code, secret, op, touch, mute) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      const now = Date.now(), ops = {}; for (const [k, v] of Object.entries(r.ops || {})) if (k !== op && v.beat > now - 60000) ops[k] = v;
      ops[op] = { beat: now, touch: touch ? now : ((r.ops || {})[op] || {}).touch || 0, mute: !!mute }; r.ops = ops; save(db); return ok({});
    },
    async sfxCfg(code, secret, cfg) { const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room'); r.sfx_cfg = cfg; save(db); return ok({}); },
    async sfxPlay(code, secret, name) { const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room'); r.sfx_ev = { id: uid(12), name, at: Date.now() }; save(db); return ok({ ev: r.sfx_ev }); },
    async setState(code, secret, state, duration, run) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      const st = { ...state };
      if (run && !r.runs[run.id]) r.runs[run.id] = { question: run.question, options: run.options, settings: run.settings || {}, started_at: Date.now() };
      if (duration > 0) st.ends_at = Date.now() + duration * 1000;
      st.rev = (r.state.rev || 0) + 1; r.state = st; save(db); return ok({ state: st });
    },
    async regenPin(code, secret) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      let p; do { p = newPin(); } while (p === r.pin); r.pin = p; save(db); return ok({ pin: p });
    },
    async publicState(code) {
      const r = room(load(), code); if (!r) return ng('no_room');
      const o = { title: r.title, anon_mode: r.anon_mode, state: r.state };
      if (r.state.phase === 'result' && r.state.run && r.state.run.phoneResult && !isTextRun(r.state.run)) o.results = tally(r, r.state.run.id, false);
      return ok(o);
    },
    async sendText(code, device, voterKey, runId, body, anon) {
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      if (!r.participants[device]) return ng('not_joined');
      const st = r.state;
      if (st.phase !== 'open' || !st.run || st.run.id !== runId || !isTextRun(st.run)) return ng('closed');
      if (st.ends_at && Date.now() > st.ends_at + 1500) return ng('closed');
      const b = cleanBody(body); if (textLen(b) > TEXT_MAX) return ng('too_long');
      const set = (r.runs[runId] || {}).settings || {};
      const an = runAnon(set, r.anon_mode) === 'full' || (!!anon && set.anonOpt !== false);
      const key = an ? voterKey : device, other = an ? device : voterKey;
      const m = ((r.texts ||= {})[runId] ||= {}); delete m[other];
      if (!b) { delete m[key]; save(db); return ok({ deleted: true }); }
      const now = Date.now();
      m[key] = m[key] ? { ...m[key], body: b, u: now } : { eid: uid(12), body: b, t: now, u: now };
      save(db); return ok({ eid: m[key].eid, body: b, anon: an });
    },
    async getTexts(code, secret, runId) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      return ok({ texts: textList(r, runId, true) });
    },
    async removeBots(code, secret) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      let n = 0;
      for (const k of Object.keys(r.participants)) if (k.startsWith('bot-')) { delete r.participants[k]; n++; }
      for (const v of Object.values(r.votes).concat(Object.values(r.texts || {}), Object.values(r.buzzes || {}))) for (const k of Object.keys(v)) if (k.startsWith('bot-') || k.startsWith('vtbot-')) delete v[k];
      save(db); return ok({ removed: n });
    },
    async setTitle(code, secret, title) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      r.title = String(title || '').trim().slice(0, 60); save(db); return ok({ title: r.title });
    },
    async putImage(code, secret, id, data) {
      if (!auth(load(), code, secret)) return ng('no_room');
      try { localStorage.setItem('evapp_demo_img_' + id, data); return ok({ id }); } catch { return ng('storage_full'); }
    },
    async getImage(code, id) { try { const d = localStorage.getItem('evapp_demo_img_' + id); return d ? ok({ data: d }) : ng('no_image'); } catch { return ng('no_image'); } },
    async getQuestions(code, secret) { const r = auth(load(), code, secret); if (!r) return ng('no_room'); return ok({ questions: r.questions || [], qrev: r.qrev || 0 }); },
    async setQuestions(code, secret, qs) {
      const db = load(); const r = auth(db, code, secret); if (!r) return ng('no_room');
      if (!Array.isArray(qs) || qs.length > 300) return ng('too_many');
      r.questions = qs; r.qrev = (r.qrev || 0) + 1; save(db); return ok({ qrev: r.qrev });
    },
    async join(code, pin, device, name) {
      name = String(name || '').trim(); if (!name || name.length > 20) return ng('bad_name');
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      if (r.pin !== pin) return ng('bad_pin');
      r.participants[device] = { name }; save(db); return ok({});
    },
    async vote(code, device, voterKey, runId, choice) {
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      if (!r.participants[device]) return ng('not_joined');
      const st = r.state;
      if (st.phase !== 'open' || !st.run || st.run.id !== runId) return ng('closed');
      if (st.ends_at && Date.now() > st.ends_at + 1500) return ng('closed');
      if (!(choice >= 0 && choice < st.run.options.length)) return ng('bad_choice');
      const key = runAnon((r.runs[runId] || {}).settings, r.anon_mode) === 'full' ? voterKey : device;
      (r.votes[runId] ||= {})[key] = { c: choice, t: Date.now() }; save(db); return ok({});
    },
    async results(code, secret, runId) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      const t = tally(r, runId, true); if (!t) return ng('no_run');
      return ok({ ...t, participants: Object.keys(r.participants).length });
    },
    async exportAll(code, secret) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      const runs = Object.entries(r.runs).sort((a, b) => a[1].started_at - b[1].started_at)
        .map(([id, x]) => ({ run_id: id, question: x.question, options: x.options, settings: { ...(x.settings || {}), anon: runAnon(x.settings, r.anon_mode) }, started_at: x.started_at, ...tally(r, id, true),
          ...(isTxt(x) ? { texts: textList(r, id, true) } : {}) }));
      const buzz = Object.entries(r.buzzes || {}).map(([round, m]) => { const ps = Object.values(m).sort((a, b) => a.rank - b.rank);
        return { round, n: ps.length ? ps[0].no : 0, started: ps.length ? ps[0].ms : 0, presses: ps.map(x => ({ rank: x.rank, name: x.name, ms: x.ms })) }; }).filter(g => g.presses.length).sort((a, b) => a.started - b.started);
      return ok({ title: r.title, anon_mode: r.anon_mode, runs, buzz });
    },
    async buzz(code, device, round) {
      const db = load(); const r = room(db, code); if (!r) return ng('no_room');
      const p = r.participants[device]; if (!p) return ng('not_joined');
      if (r.state.phase !== 'buzz' || !r.state.buzz || r.state.buzz.round !== round) return ng('closed');
      const m = ((r.buzzes ||= {})[round] ||= {});
      if (!m[device]) { m[device] = { name: p.name, ms: Date.now(), rank: Object.keys(m).length + 1, no: r.state.buzz.n || 0 }; save(db); }
      const first = Object.values(m).find(x => x.rank === 1) || m[device];
      return ok({ rank: m[device].rank, ms: m[device].ms, diff: m[device].ms - first.ms });
    },
    async buzzList(code, secret, round) {
      const r = auth(load(), code, secret); if (!r) return ng('no_room');
      return ok({ round, presses: Object.values((r.buzzes || {})[round] || {}).sort((a, b) => a.rank - b.rank).map(x => ({ rank: x.rank, name: x.name, ms: x.ms })) });
    },
    async closeRoom(code, secret) { const db = load(); if (auth(db, code, secret)) delete db.rooms[code.toUpperCase()]; save(db); return ok({}); },
    subscribe(code, cb, onBz, onSx) {
      if (!subs.has(code)) subs.set(code, new Set()); subs.get(code).add(cb); setTimeout(cb, 0);
      if (onBz) { if (!bzSubs.has(code)) bzSubs.set(code, new Set()); bzSubs.get(code).add(onBz); }
      if (onSx) { if (!sxSubs.has(code)) sxSubs.set(code, new Set()); sxSubs.get(code).add(onSx); }
    },
    ping(code) { if (bc) bc.postMessage({ code }); },
    pingBuzz(code) { if (bc) bc.postMessage({ code, bz: true }); },
    pingSfx(code) { if (bc) bc.postMessage({ code, sx: true }); },
  };
}

async function makeSupaServer() {
  await loadScript(SUPA_SRC);
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  async function rpc(fn, args) {
    const t0 = Date.now();
    try {
      const { data, error } = await sb.rpc(fn, args); const t1 = Date.now();
      if (error) return { ok: false, error: 'server', detail: error.message };
      if (data && data.server_now) Clock.sync(Number(data.server_now), t0, t1);
      return data || { ok: false, error: 'server' };
    } catch (e) { return { ok: false, error: 'network', detail: String(e) }; }
  }
  const chans = new Map();
  return {
    demo: false,
    createRoom: ({ password, title, anon }) => rpc('ev_create_room', { p_password: password, p_title: title, p_anon: anon }),
    opState: (c, s) => rpc('ev_op_state', { p_code: c, p_secret: s }),
    setState: (c, s, state, dur, run) => rpc('ev_set_state', { p_code: c, p_secret: s, p_state: state, p_duration: dur || 0, p_run: run || null }),
    regenPin: (c, s) => rpc('ev_regen_pin', { p_code: c, p_secret: s }),
    publicState: c => rpc('ev_public_state', { p_code: c }),
    join: (c, pin, d, name) => rpc('ev_join', { p_code: c, p_pin: pin, p_device: d, p_name: name }),
    vote: (c, d, vk, run, ch) => rpc('ev_vote', { p_code: c, p_device: d, p_voter_key: vk, p_run_id: run, p_choice: ch }),
    sendText: (c, d, vk, run, body, anon) => rpc('ev_send_text', { p_code: c, p_device: d, p_voter_key: vk, p_run_id: run, p_body: body, p_anon: !!anon }),
    getTexts: (c, s, run) => rpc('ev_get_texts', { p_code: c, p_secret: s, p_run_id: run }),
    buzz: (c, d, round) => rpc('ev_buzz', { p_code: c, p_device: d, p_round: round }),
    dispBeat: (c, s) => rpc('ev_disp_beat', { p_code: c, p_secret: s }),
    opBeat: (c, s, op, touch, mute) => rpc('ev_op_beat', { p_code: c, p_secret: s, p_op: op, p_touch: !!touch, p_mute: !!mute }),
    sfxCfg: (c, s, cfg) => rpc('ev_sfx_cfg', { p_code: c, p_secret: s, p_cfg: cfg }),
    sfxPlay: (c, s, name) => rpc('ev_sfx_play', { p_code: c, p_secret: s, p_name: name }),
    buzzList: (c, s, round) => rpc('ev_buzz_list', { p_code: c, p_secret: s, p_round: round }),
    results: (c, s, run) => rpc('ev_results', { p_code: c, p_secret: s, p_run_id: run }),
    exportAll: (c, s) => rpc('ev_export', { p_code: c, p_secret: s }),
    closeRoom: (c, s) => rpc('ev_close_room', { p_code: c, p_secret: s }),
    setTitle: (c, s, t) => rpc('ev_set_title', { p_code: c, p_secret: s, p_title: t }),
    putImage: (c, s, id, data) => rpc('ev_put_image', { p_code: c, p_secret: s, p_id: id, p_data: data }),
    getImage: (c, id) => rpc('ev_get_image', { p_code: c, p_id: id }),
    removeBots: (c, s) => rpc('ev_remove_bots', { p_code: c, p_secret: s }),
    getQuestions: (c, s) => rpc('ev_get_questions', { p_code: c, p_secret: s }),
    setQuestions: (c, s, q) => rpc('ev_set_questions', { p_code: c, p_secret: s, p_questions: q }),
    // リアルタイム通信は「変わったよ」の合図だけ。中身はかならずサーバーに取りに行く（いたずら合図対策）
    // 早押しの「押したよ」は別の合図（bz）。参加者のスマホは聞かないので、100人が押しても大丈夫
    subscribe(code, cb, onBz, onSx) {
      const ch = sb.channel('evapp-' + code, { config: { broadcast: { self: false } } });
      ch.on('broadcast', { event: 'ping' }, () => cb());
      if (onBz) ch.on('broadcast', { event: 'bz' }, () => onBz());
      if (onSx) ch.on('broadcast', { event: 'sx' }, () => onSx());  // 効果音まわりの合図（参加者のスマホは聞かない）
      ch.subscribe(st => { if (st === 'SUBSCRIBED') cb(); });
      chans.set(code, ch);
    },
    ping(code) { const ch = chans.get(code); if (ch) Promise.resolve(ch.send({ type: 'broadcast', event: 'ping', payload: {} })).catch(() => {}); },
    pingBuzz(code) { const ch = chans.get(code); if (ch) Promise.resolve(ch.send({ type: 'broadcast', event: 'bz', payload: {} })).catch(() => {}); },
    pingSfx(code) { const ch = chans.get(code); if (ch) Promise.resolve(ch.send({ type: 'broadcast', event: 'sx', payload: {} })).catch(() => {}); },
  };
}

/* =========================================================
   部屋の様子を見張る係（マスター画面とモニタ画面で共通）
   ========================================================= */
function makeWatcher(code, secret, onUpdate, onBz) {
  const w = { room: null, participants: 0, results: null, resultsRun: null, gone: false, err: null };
  let busyOp = false, busyRes = false, stopped = false;
  async function fetchOp() {
    if (busyOp) return; busyOp = true;
    const res = await API.opState(code, secret); busyOp = false;
    if (res.ok) {
      const prevRev = w.room && w.room.state && w.room.state.rev;
      w.room = res.room; w.participants = Number(res.participants) || 0; w.err = null;
      if (res.room.state && res.room.state.run && res.room.state.rev !== prevRev) fetchRes();
    } else if (res.error === 'no_room') w.gone = true;
    else w.err = res.error;
    onUpdate(w);
  }
  async function fetchRes() {
    const st = w.room && w.room.state; if (!st || !st.run || busyRes) return;
    busyRes = true; const runId = st.run.id;
    const res = await API.results(code, secret, runId); busyRes = false;
    if (res.ok) { w.results = res; w.resultsRun = runId; w.participants = Number(res.participants) || w.participants; onUpdate(w); }
  }
  API.subscribe(code, fetchOp, onBz ? () => onBz() : null, () => fetchOp());
  (async () => {
    let i = 0;
    while (!stopped) {
      await sleep(1000); i++;
      const st = w.room && w.room.state;
      if (st && st.phase === 'open') fetchRes();
      if (i % 3 === 0 || !w.room || (st && (st.phase === 'open' || st.phase === 'closed' || st.phase === 'buzz' || isTextRun(st.run)))) fetchOp();
    }
  })();
  w.refresh = fetchOp; w.refreshResults = fetchRes; w.stop = () => { stopped = true; };
  fetchOp();
  return w;
}

/* =========================================================
   早押し：押した順の一覧をとってくる係（マスター画面とモニタ画面で共通）
   ========================================================= */
function makeBuzzFeed(code, secret, getRound, onChange) {
  const f = { round: null, list: [], busy: false, again: false, at: 0 };
  async function load() {
    const round = getRound(); if (!round) return;
    if (f.busy) { f.again = true; return; }
    f.busy = true; const res = await API.buzzList(code, secret, round); f.busy = false; f.at = Date.now();
    if (res.ok && getRound() === round) {
      const list = Array.isArray(res.presses) ? res.presses : [];
      const changed = round !== f.round || JSON.stringify(list) !== JSON.stringify(f.list);
      f.round = round; f.list = list; if (changed) onChange();
    }
    if (f.again) { f.again = false; setTimeout(load, 120); }
  }
  setInterval(() => { const r = getRound(); if (r && (r !== f.round || Date.now() - f.at > 1000)) load(); }, 250);
  f.kick = load;
  f.get = round => f.round === round ? f.list : [];
  f.loaded = round => f.round === round;
  return f;
}

/* =========================================================
   ステージ（モニタに映す画面）— 表示用ウィンドウとマスターのプレビューで共通
   ========================================================= */
function makeStage(el, getW, joinUrl, getHold, opts = {}) {
  el.classList.add('stage');
  let key = '', animTk = null, scrollKey = '', bzSeen = { round: null, n: 0 };
  function screenOf(st) {
    if (st && st.phase === 'buzz' && st.buzz) return 'buzz';
    if (!st || st.phase === 'waiting' || !st.run) return 'waiting';
    if (st.phase === 'open') return st.ends_at && Clock.now() >= st.ends_at ? 'closing' : 'open';
    if (isTextRun(st.run)) return st.phase === 'result' && st.view === 'tiles' ? 'tiles' : st.phase === 'result' && st.pick ? 'pick' : 'closed';

  const unlock = () => { SFX.unlock(); setTimeout(updLock, 300); };

  function updLock() { lock.hidden = !SFX.enabled() || SFX.running(); }

  document.addEventListener('qrready', () => { stage.reset(); stage.update(); });

  /* --- 状態を送る --- */

      <div class="sharebox"><div style="font-size:2rem">🖥</div><div><b>表示用（モニタをつないだ別のPCで開く）</b><div class="u">${esc(dispUrl)}</div><button data-copy="disp">コピー</button></div></div>
      <div class="sharebox"><div id="rmQr" style="font-size:2rem">📱</div><div><b>リモコン用（スマホでこの操作画面を開く）</b><div class="u">${esc(remoteUrl)}</div><div class="row"><button data-copy="remote">コピー</button><button id="rmShow">QRを表示</button></div></div></div>
      <p class="warn">⚠ 表示用とリモコン用のURLにはマスターのカギが入っています。観客には見せないでください。${DEMO ? '<br>（おためしモードでは、同じブラウザの中でしか動きません）' : ''}</p>
      <div class="row" style="justify-content:flex-end"><button data-close>閉じる</button></div>`);
    $$('[data-copy]', m).forEach(b => b.onclick = () => copyText({ join: joinUrl, disp: dispUrl, remote: remoteUrl }[b.dataset.copy]));
    $('#rmShow', m).onclick = () => { const q = qrDataUrl(remoteUrl); if (q) $('#rmQr', m).innerHTML = `<img src="${q}" alt="">`; else toast('QRコードを作れませんでした'); };
  };
  $('#btnSave').onclick = () => {
    const m = openModal(`<h2>💾 結果を保存</h2><p>この部屋で出したアンケートの質問・設定・結果を、ぜんぶファイルに保存します。<br><small>部屋と結果はサーバーから24時間で消えます。<b>記録ファイル（JSON）</b>は、あとでトップの「記録を見る」から開けます。</small></p>
      <div class="row"><button class="primary" id="sJson">記録ファイル（JSON）</button><button id="sCsv">CSV（エクセル用）</button><button data-close>閉じる</button></div>`);
    const get = async () => {
      const res = await API.exportAll(code, secret); if (!res.ok) { toast(errMsg(res.error)); return null; }
      const rec = makeRecord(res, code); lastRec = rec; if (backupOn()) saveBackup(rec);
      if (!rec.runs.length && !(rec.buzz || []).length) { toast('まだ結果がありません'); return null; }
      rec.images = await collectImages(idsOfRecord(rec)); return rec;
    };
    $('#sJson', m).onclick = async () => { const r = await get(); if (r) { download(recName(r, 'json'), JSON.stringify(r, null, 2), 'application/json'); m.remove(); } };
    $('#sCsv', m).onclick = async () => { const r = await get(); if (r) { download(recName(r, 'csv'), recordCsv(r), 'text/csv'); m.remove(); } };
  };
  $('#btnEnd').onclick = async () => {
    if (backupOn()) await refreshHistory();
    if (!confirm('部屋を終了しますか？\n参加者は入れなくなり、サーバーの結果も消えます。\n' + (backupOn() && lastRec && lastRec.runs.length ? '（このPCのブラウザには控えが残ります）' : '（先に「結果を保存」しておくと安心です）'))) return;
    const res = await API.closeRoom(code, secret);
    if (!res.ok) return toast(errMsg(res.error));
    API.ping(code); dropMyRoom(code); location.href = pageUrl();
  };

  /* --- テスト用ダミー参加者 --- */
  const BOTS_KEY = 'evapp_bots_' + code;
  const bots = store.get(BOTS_KEY, []);
  const botCount = () => { $('#botN').textContent = bots.length ? `（いま${bots.length}人）` : ''; };
  botCount();
  const NAMES = ['たろう', 'はなこ', 'けんじ', 'さくら', 'ゆうき', 'みどり', 'ひろし', 'あおい', 'そうた', 'ももこ', 'だいち', 'りん', 'かずき', 'なな', 'しょう', 'えみ', 'りく', 'ほのか', 'こうへい', 'ちひろ'];
  async function addBots(n) {
    if (!w.room) return;
    for (let i = 0; i < n; i++) {
      const d = 'bot-' + uid(10);
      const res = await API.join(code, w.room.pin, d, 'ダミー' + NAMES[Math.floor(Math.random() * NAMES.length)]);
      if (res.ok) bots.push({ d, vt: 'vtbot-' + uid(12) });
    }
    store.set(BOTS_KEY, bots); botCount();
    w.refresh(); toast(`ダミー${n}人が参加しました`);
  }
  function runBotsBuzz(round) {
    bots.forEach(b => { if (Math.random() < 0.2) return; setTimeout(() => { if (bzRound() === round) API.buzz(code, b.d, round).then(r => { if (r.ok) API.pingBuzz(code); }); }, 400 + Math.random() * 3500); });
  }
  const BOT_TEXTS = ['たのしかった！', 'また来たいです', 'クイズがむずかしかった〜', 'お弁当がおいしかったです🍙', '司会の人のダジャレが寒かった', 'となりの人と仲良くなれました！\nありがとうございました', '次は早押しクイズやりたい', 'もっと時間がほしかったな', 'ビンゴで当たりたかった…', '最高の一日でした！！', 'スマホで参加できるのべんり', '眠くなった（ごめんなさい）'];
  function runBots(st) {
    if (!bots.length || !$('#botAuto') || !$('#botAuto').checked) return;
    if (isTextRun(st.run)) {
      const span = st.ends_at ? Math.max(1200, st.ends_at - Clock.now() - 1000) : 8000;
      bots.forEach(b => { if (Math.random() < 0.15) return; setTimeout(() => API.sendText(code, b.d, b.vt, st.run.id, BOT_TEXTS[Math.floor(Math.random() * BOT_TEXTS.length)]), Math.random() * span * 0.85); });
      return;
    }
    const n = st.run.options.length, wts = Array.from({ length: n }, () => Math.random() + 0.25), sum = wts.reduce((a, b) => a + b, 0);
    const pick = () => { let x = Math.random() * sum; for (let i = 0; i < n; i++) { x -= wts[i]; if (x <= 0) return i; } return n - 1; };
    const span = st.ends_at ? Math.max(1200, st.ends_at - Clock.now() - 1000) : 9000;
    bots.forEach(b => {
      if (Math.random() < 0.08) return;
      setTimeout(() => {
        API.vote(code, b.d, b.vt, st.run.id, pick());
        if (Math.random() < 0.12) setTimeout(() => API.vote(code, b.d, b.vt, st.run.id, Math.floor(Math.random() * n)), 1500);
      }, Math.random() * span * 0.85);
    });
  }
  $('#bot10').onclick = () => addBots(10); $('#bot30').onclick = () => addBots(30);
  $('#botKick').onclick = async () => {
    if (!confirm('ダミーを全員帰らせますか？（ダミーの投票も消えます）')) return;
    const res = await API.removeBots(code, secret);
    if (!res.ok) return toast(errMsg(res.error));
    bots.length = 0; store.del(BOTS_KEY); botCount();
    w.refresh(); w.refreshResults(); API.ping(code); if (!$('#tabHist').hidden) refreshHistory();
    toast(`ダミー${res.removed}人が帰りました`);
  };
}

/* =========================================================
   はじまり
   ========================================================= */
(async function main() {
  try { API = DEMO ? makeLocalServer() : await makeSupaServer(); }
  catch (e) { $('#app').innerHTML = msgPage('📡', 'サーバーにつながりません', '電波を確認して、ページを読みこみ直してください。', false); return; }
  loadScript(QR_SRC).then(() => { qrReady = true; document.dispatchEvent(new Event('qrready')); }).catch(() => {});
  const r = Q.get('r'), op = Q.get('op'), disp = Q.get('disp');
  if (r) participantView(r.toUpperCase());
  else if (op) operatorView(op.toUpperCase());
  else if (disp) displayView(disp.toUpperCase());
  else landingView();
})();
</script>
